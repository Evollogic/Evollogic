<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autorização Concluída</title>
    <style>
        :root {
            --discord-blurple: #5865F2;
            --discord-dark: #1E1F22;
            --discord-darker: #111214;
            --success-green: #57F287;
            --error-red: #ED4245;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--discord-darker);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Animação de Fundo Animado */
        .bg-animation {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(88,101,242,0.15) 0%, rgba(30,31,34,0) 50%);
            animation: rotateBG 20s linear infinite;
            z-index: 0;
        }

        @keyframes rotateBG {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Estilo do Cartão Principal (Glassmorphism) */
        .glass-card {
            background: rgba(30, 31, 34, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 50px 40px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 1;
            transform: translateY(30px);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }

        /* Ícone Animado */
        .icon-container {
            width: 90px;
            height: 90px;
            margin: 0 auto 25px;
            background: rgba(87, 242, 135, 0.1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .icon-container::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid var(--success-green);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        svg {
            width: 40px;
            height: 40px;
            fill: none;
            stroke: var(--success-green);
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 100;
            stroke-dashoffset: 100;
            animation: drawCheck 1s ease-out 0.5s forwards;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        p {
            color: #A0A4AB;
            font-size: 16px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        /* Console Log visual (Para dar um ar "Hacker/Tech") */
        .status-box {
            background: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            padding: 15px;
            font-family: monospace;
            font-size: 13px;
            color: #A0A4AB;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .status-box span {
            color: var(--discord-blurple);
        }

        .status-box.success span { color: var(--success-green); }
        .status-box.error span { color: var(--error-red); }

        .btn-close {
            margin-top: 30px;
            background-color: var(--discord-blurple);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        .btn-close:hover {
            background-color: #4752C4;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="bg-animation"></div>

    <div class="glass-card">
        <div class="icon-container" id="iconBox">
            <svg viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>

        <h1 id="titulo">Autorizado com Sucesso!</h1>
        <p id="subtitulo">A conta foi vinculada com segurança ao sistema. Você já pode fechar esta aba e voltar.</p>

        <div class="status-box" id="statusBox">
            > Aguardando código OAuth2...
        </div>

        <button class="btn-close" onclick="fecharAba()">Fechar Janela</button>
    </div>

    <script>
        // Lógica para dar um charme e identificar se a URL recebeu o ?code= do Discord
        document.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const statusBox = document.getElementById('statusBox');
            const titulo = document.getElementById('titulo');
            const codigo = urlParams.get('code');
            const erro = urlParams.get('error');

            setTimeout(() => {
                if (erro) {
                    titulo.innerText = "Autorização Cancelada";
                    statusBox.innerHTML = `> Status: <span style="color: #ED4245;">Falha</span><br>> Motivo: ${erro}`;
                    document.querySelector('.icon-container svg').style.stroke = '#ED4245';
                    document.querySelector('.icon-container::before').style.borderColor = '#ED4245';
                } else if (codigo) {
                    statusBox.innerHTML = `> Handshake: <span>OK</span><br>> Código obtido: <span>${codigo.substring(0, 8)}...</span><br>> Conexão estabelecida com sucesso.`;
                    statusBox.classList.add('success');
                } else {
                    statusBox.innerHTML = `> Status: <span style="color: #FEE75C;">Modo de Visualização</span><br>> Nenhum código detectado na URL.`;
                }
            }, 1000); // Um delay de 1 segundo para dar tempo do usuário ver a animação inicial
        });

        function fecharAba() {
            window.close(); // Em alguns navegadores isso pode ser bloqueado se a aba não foi aberta por um script, mas é uma boa prática manter.
            document.getElementById('titulo').innerText = "Você pode fechar a aba!";
        }
    </script>

</body>
</html>
