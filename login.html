<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evollogic - Login</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start; 
            overflow-x: hidden; 
            overflow-y: auto;   
            padding: 40px 20px; 
            box-sizing: border-box;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, rgba(0,0,0,0) 70%);
            top: -100px;
            left: -100px;
            z-index: 0;
            pointer-events: none;
        }

        .login-container {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 10;
            margin: auto; 
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-sizing: border-box;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header img {
            width: 80px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .login-header h1 {
            font-size: 1.8rem;
            margin: 0 0 5px 0;
            font-weight: 700;
            color: #f8fafc;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin: 0;
        }

        /* Alertas de Erro/Sucesso */
        .alert-box {
            display: none;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
            animation: slideUp 0.3s ease;
        }

        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            border: 1px solid transparent;
        }

        .btn-discord {
            background: rgba(88, 101, 242, 0.1);
            color: #fff;
            border-color: rgba(88, 101, 242, 0.3);
        }

        .btn-discord:hover {
            background: #5865F2;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4);
            transform: translateY(-2px);
        }

        .btn-google {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .btn-google:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .social-icon {
            width: 20px;
            height: 20px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .divider:not(:empty)::before { margin-right: 15px; }
        .divider:not(:empty)::after { margin-left: 15px; }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
            position: relative;
        }

        .input-group label {
            display: block;
            color: #cbd5e1;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-wrapper i,
        .input-wrapper svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%); 
            color: #94a3b8;
            width: 20px;
            height: 20px;
            z-index: 2; 
        }

        .input-field {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            padding: 14px 14px 14px 50px; 
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .input-field:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
        }

        .input-field:focus + i,
        .input-field:focus ~ svg {
            color: #38bdf8;
            transition: 0.3s;
        }

        .forgot-password {
            display: block;
            text-align: right;
            color: #38bdf8;
            font-size: 0.85rem;
            text-decoration: none;
            margin-top: 8px;
            transition: 0.3s;
        }

        .forgot-password:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            background: #38bdf8;
            color: #020617;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        .submit-btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        .register-area {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .register-area a {
            color: #38bdf8;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .register-area a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="login-header">
            <img src="https://i.imgur.com/31WnC6D.png" alt="Evollogic Logo">
            <h1 data-i18n="h1_welcome">Bem-vindo de volta 👋</h1>
            <p data-i18n="p_access">Acesse o seu ecossistema no Hub Central</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <div class="social-login">
            <button class="social-btn btn-discord" type="button" onclick="loginWith('Discord')">
                <img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png" alt="Discord" class="social-icon">
                Discord
            </button>
            <button class="social-btn btn-google" type="button" onclick="loginWith('Google')">
                <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google" class="social-icon">
                Google
            </button>
        </div>

        <div class="divider" data-i18n="divider_text">ou continue com seu e-mail</div>

        <form id="loginForm">
            
            <div class="input-group">
                <label for="email" data-i18n="label_email">E-mail ou Nome de Usuário</label>
                <div class="input-wrapper">
                    <input type="text" id="email" class="input-field" data-i18n-placeholder="placeholder_email" placeholder="contato@evollogic.com" required>
                    <i data-feather="user"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="password" data-i18n="label_pass">Senha</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                    <i data-feather="lock"></i>
                </div>
                <a href="#" class="forgot-password" data-i18n="forgot_pass">Esqueci minha senha</a>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn" data-i18n="btn_login">Acessar Plataforma</button>

        </form>

        <div class="register-area">
            <span data-i18n="no_account">Ainda não faz parte?</span> 
            <a href="register.html" data-i18n="create_account">Criar uma conta</a>
        </div>

    </div>

    <script>
        feather.replace();

        const translations = {
            PT: {
                page_title: "Evollogic - Login",
                h1_welcome: "Bem-vindo de volta 👋",
                p_access: "Acesse o seu ecossistema no Hub Central",
                divider_text: "ou continue com seu e-mail",
                label_email: "E-mail ou Nome de Usuário",
                placeholder_email: "contato@evollogic.com",
                label_pass: "Senha",
                forgot_pass: "Esqueci minha senha",
                btn_login: "Acessar Plataforma",
                no_account: "Ainda não faz parte?",
                create_account: "Criar uma conta",
                authenticating: "Autenticando...",
                auth_alert: "Iniciando autenticação via",
                invalid_account: "Conta inválida. O usuário não foi encontrado.",
                wrong_password: "A senha está incorreta.",
                server_error: "Erro no servidor. Tente novamente mais tarde.",
                login_success: "Login realizado com sucesso! Redirecionando...",
                account_not_found: "Nenhuma conta encontrada com este Discord. Por favor, crie uma conta primeiro."
            },
            EN: {
                page_title: "Evollogic - Login",
                h1_welcome: "Welcome back 👋",
                p_access: "Access your ecosystem in the Central Hub",
                divider_text: "or continue with your email",
                label_email: "Email or Username",
                placeholder_email: "contact@evollogic.com",
                label_pass: "Password",
                forgot_pass: "Forgot my password",
                btn_login: "Sign In to Platform",
                no_account: "Not a member yet?",
                create_account: "Create an account",
                authenticating: "Authenticating...",
                auth_alert: "Starting authentication via",
                invalid_account: "Invalid account. User not found.",
                wrong_password: "The password is incorrect.",
                server_error: "Server error. Please try again later.",
                login_success: "Login successful! Redirecting...",
                account_not_found: "No account found with this Discord. Please create an account first."
            },
            ES: {
                page_title: "Evollogic - Iniciar Sesión",
                h1_welcome: "Bienvenido de nuevo 👋",
                p_access: "Accede a tu ecosistema en el Hub Central",
                divider_text: "o continúa con tu correo",
                label_email: "Correo electrónico o Usuario",
                placeholder_email: "contacto@evollogic.com",
                label_pass: "Contraseña",
                forgot_pass: "Olvidé mi contraseña",
                btn_login: "Acceder a la Plataforma",
                no_account: "¿Aún no eres miembro?",
                create_account: "Crear una cuenta",
                authenticating: "Autenticando...",
                auth_alert: "Iniciando autenticación vía",
                invalid_account: "Cuenta inválida. Usuario no encontrado.",
                wrong_password: "La contraseña es incorrecta.",
                server_error: "Error del servidor. Inténtalo de nuevo más tarde.",
                login_success: "¡Inicio de sesión exitoso! Redirigiendo...",
                account_not_found: "No se encontró cuenta con este Discord. Por favor, crea una cuenta primero."
            }
        };

        let currentLang = localStorage.getItem('userLanguage');

        if (!currentLang) {
            const browserLang = (navigator.language || navigator.userLanguage).substring(0, 2).toUpperCase();
            currentLang = ['PT', 'EN', 'ES'].includes(browserLang) ? browserLang : 'EN';
            localStorage.setItem('userLanguage', currentLang);
        }

        function applyTranslations(lang) {
            document.title = translations[lang].page_title;
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.innerHTML = translations[lang][key];
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
                const key = element.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    element.placeholder = translations[lang][key];
                }
            });
        }

        function showAlert(messageKey, isError = true) {
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'block';
            alertBox.innerHTML = translations[currentLang][messageKey] || messageKey;
            
            if (isError) {
                alertBox.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
                alertBox.style.color = '#f87171';
                alertBox.style.border = '1px solid rgba(239, 68, 68, 0.3)';
            } else {
                alertBox.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
                alertBox.style.color = '#34d399';
                alertBox.style.border = '1px solid rgba(16, 185, 129, 0.3)';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyTranslations(currentLang);
            window.addEventListener('storage', (e) => {
                if (e.key === 'userLanguage') {
                    currentLang = e.newValue || 'EN';
                    applyTranslations(currentLang);
                }
            });

            // ==========================================
            // LÓGICA DO RETORNO DO DISCORD/GOOGLE (OAUTH)
            // ==========================================
            const urlParams = new URLSearchParams(window.location.search);
            const loginStatus = urlParams.get('login');
            const userToken = urlParams.get('token');
            const errorStatus = urlParams.get('error');

            // Verifica se houve erro de conta não encontrada via Discord
            if (errorStatus === 'account_not_found') {
                // Limpa a URL para remover os parâmetros
                window.history.replaceState({}, document.title, window.location.pathname);
                // Exibe o alerta de erro
                showAlert('account_not_found', true);
            }
            // Verifica se o login foi um sucesso
            else if (loginStatus === 'success' && userToken) {
                // 1. Salva o token para manter o usuário logado
                localStorage.setItem('evollogic_auth_token', userToken);

                // 2. Limpa a URL para o token sumir da barra de endereço
                window.history.replaceState({}, document.title, window.location.pathname);

                // 3. Mostra o alerta verde de sucesso na tela
                showAlert('login_success', false);

                // 4. Redireciona o usuário para o painel dele
                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 1500); // 1.5 segundos de pausa para ele ler a mensagem
            }
        });

        // ==========================================
        // LÓGICA DE LOGIN COM A API (MONGODB)
        // ==========================================
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            // Reset UI
            alertBox.style.display = 'none';
            btn.innerHTML = translations[currentLang].authenticating;
            btn.style.opacity = '0.8';
            btn.style.pointerEvents = 'none';

            try {
                // Chama o backend Node.js hospedado no Railway
                const response = await fetch('https://evollogic-backend-production.up.railway.app/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    // Erro (senha errada, conta não existe, etc.)
                    showAlert(data.error || 'invalid_account', true);
                    
                    // Restaura o botão
                    btn.innerHTML = translations[currentLang].btn_login;
                    btn.style.opacity = '1';
                    btn.style.pointerEvents = 'auto';
                } else {
                    // Sucesso no login manual - Salva o token
                    if(data.token) {
                        localStorage.setItem('evollogic_auth_token', data.token);
                    }
                    
                    showAlert('login_success', false);
                    setTimeout(() => {
                        window.location.href = 'profile.html'; // Redireciona pro profile
                    }, 1000);
                }

            } catch (error) {
                console.error("Erro na requisição:", error);
                showAlert('server_error', true);
                btn.innerHTML = translations[currentLang].btn_login;
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }
        });

        // ==========================================
        // REDIRECIONAMENTO PRO BACKEND (OAUTH)
        // ==========================================
        function loginWith(provider) {
            const btnDiscord = document.querySelector('.btn-discord');
            const btnGoogle = document.querySelector('.btn-google');
            const baseUrl = 'https://evollogic-backend-production.up.railway.app';

            if (provider === 'Discord') {
                btnDiscord.innerHTML = translations[currentLang].authenticating || "Autenticando...";
                window.location.href = `${baseUrl}/api/auth/discord`;
            } else if (provider === 'Google') {
                btnGoogle.innerHTML = translations[currentLang].authenticating || "Autenticando...";
                window.location.href = `${baseUrl}/api/auth/google`;
            }
        }
    </script>
</body>
</html>
