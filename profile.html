<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evollogic - Perfil</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        :root {
            --bg-dark: #020617;
            --bg-card: #151c2c; /* Cor exata da print para o card */
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8; /* Azul do banner da print */
            --primary-hover: #7dd3fc;
            --danger: #f87171;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        /* Efeito de brilho de fundo */
        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, rgba(0,0,0,0) 70%);
            top: -200px;
            left: -200px;
            z-index: 0;
            pointer-events: none;
        }

        /* =============================
           MENU LATERAL (SIDEBAR)
        ============================= */
        .sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            z-index: 20;
            height: 100vh;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            transition: all 0.3s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 50px;
            padding-left: 10px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand img {
            width: 40px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .brand h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 1px;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            padding: 5px;
        }

        .nav-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            border-radius: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
        }

        .nav-link i {
            width: 20px;
        }

        .logout-btn {
            margin-top: auto;
            color: var(--danger);
        }

        .logout-btn:hover {
            background: rgba(248, 113, 113, 0.1);
            color: #fca5a5;
        }

        /* =============================
           ÁREA PRINCIPAL (PERFIL)
        ============================= */
        .main-content {
            flex: 1;
            padding: 50px 40px;
            z-index: 1;
            box-sizing: border-box;
            max-width: 900px;
            margin: 0 auto;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header {
            margin-bottom: 30px;
        }

        .page-header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            letter-spacing: -0.5px;
        }

        .page-header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 1.05rem;
        }

        /* =============================
           CARD DE PERFIL (IDÊNTICO À PRINT)
        ============================= */
        .profile-card {
            background: var(--bg-card);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .profile-banner {
            height: 160px;
            background: var(--primary);
            width: 100%;
        }

        .profile-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 30px 40px 30px;
            margin-top: -65px; /* Puxa a foto para cima do banner */
        }

        .profile-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 6px solid var(--bg-card); /* Borda escura igual ao fundo */
            background: #fff;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin-bottom: 15px;
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 700;
            margin: 0 0 5px 0;
            text-align: center;
        }

        .profile-email {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0 0 25px 0;
        }

        .profile-email i {
            width: 16px;
            height: 16px;
        }

        .btn-edit {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 24px;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-edit:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* =============================
           RESPONSIVIDADE (CELULAR)
        ============================= */
        @media (max-width: 768px) {
            body { 
                flex-direction: column; 
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding: 15px 20px;
                border-right: none;
                border-bottom: 1px solid var(--border-glass);
            }

            .brand { 
                margin-bottom: 0; 
            }

            .mobile-menu-btn {
                display: block; /* Mostra o botão de menu hambúrguer */
            }

            .nav-menu { 
                display: none; /* Esconde o menu por padrão no celular */
                padding-top: 20px;
            }

            .nav-menu.show {
                display: flex; /* Mostra quando clica no botão */
            }

            .main-content { 
                padding: 30px 20px; 
            }

            .profile-banner {
                height: 120px;
            }

            .profile-avatar {
                width: 110px;
                height: 110px;
                margin-top: -55px;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">
                <img src="https://i.imgur.com/31WnC6D.png" alt="Evollogic Logo">
                <h2>Evollogic</h2>
            </div>
            <button class="mobile-menu-btn" onclick="toggleMenu()">
                <i data-feather="menu"></i>
            </button>
        </div>

        <ul class="nav-menu" id="navMenu">
            <li>
                <a href="index.html" class="nav-link">
                    <i data-feather="grid"></i> Hub Central
                </a>
            </li>
            <li>
                <a href="profile.html" class="nav-link active">
                    <i data-feather="user"></i> Meu Perfil
                </a>
            </li>
            <li>
                <a href="#" class="nav-link">
                    <i data-feather="shield"></i> Segurança
                </a>
            </li>
            <li>
                <a href="#" class="nav-link">
                    <i data-feather="settings"></i> Configurações
                </a>
            </li>
            <li>
                <a href="#" class="nav-link logout-btn" onclick="logout()">
                    <i data-feather="log-out"></i> Sair da conta
                </a>
            </li>
        </ul>
    </aside>

    <main class="main-content">
        
        <div class="page-header">
            <h1>Visão Geral</h1>
            <p>Gerencie suas informações pessoais e segurança.</p>
        </div>

        <div class="profile-card">
            <div class="profile-banner"></div>
            
            <div class="profile-content">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Carregando" alt="Avatar do Usuário" class="profile-avatar" id="userAvatar">
                
                <h2 class="profile-name" id="userName">Carregando...</h2>
                <p class="profile-email">
                    <i data-feather="mail"></i> 
                    <span id="userEmail">carregando@...</span>
                </p>

                <button class="btn-edit">
                    <i data-feather="edit-2" style="width: 16px;"></i> Editar Perfil
                </button>
            </div>
        </div>

    </main>

    <script>
        // Inicializa os ícones
        feather.replace();

        // Função para abrir/fechar o menu no celular
        function toggleMenu() {
            const menu = document.getElementById('navMenu');
            menu.classList.toggle('show');
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // LER A URL (Caso venha direto do redirecionamento do Discord/Google)
            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');
            const isFirstLogin = urlParams.get('first_login');

            if (tokenFromUrl) {
                // Se veio token na URL, salva no LocalStorage
                localStorage.setItem('evollogic_auth_token', tokenFromUrl);
                // Limpa a URL para ficar bonita
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            if (isFirstLogin === 'true') {
                alert("Bem-vindo à Evollogic! Sua conta foi criada com sucesso.");
            }

            // ==========================================
            // BUSCAR DADOS DO USUÁRIO NA API COM JWT
            // ==========================================
            const token = localStorage.getItem('evollogic_auth_token');

            if (!token) {
                // Se não tem token, joga de volta pro login!
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch('https://evollogic-backend-production.up.railway.app/api/user/me', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Sessão expirada ou inválida');
                }

                const userData = await response.json();

                // Preenche o HTML com os dados reais do banco
                document.getElementById('userName').textContent = userData.name || 'Sem Nome';
                document.getElementById('userEmail').textContent = userData.email || 'Discord Vinculado';
                
                if (userData.avatar) {
                    document.getElementById('userAvatar').src = userData.avatar;
                }

            } catch (error) {
                console.error("Erro ao carregar perfil:", error);
                alert("Sua sessão expirou. Por favor, faça login novamente.");
                localStorage.removeItem('evollogic_auth_token');
                window.location.href = 'login.html';
            }
        });

        // Função de Logout
        function logout() {
            if(confirm("Tem certeza que deseja sair?")) {
                localStorage.removeItem('evollogic_auth_token');
                window.location.href = 'login.html'; 
            }
        }
    </script>
</body>
</html>
