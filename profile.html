<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evollogic - Editar Perfil</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        :root {
            --bg-dark: #020617;
            --bg-card: #151c2c;
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #7dd3fc;
            --success: #34d399;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .edit-container {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-glass);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 1.8rem; }
        .btn-back { color: var(--text-muted); cursor: pointer; transition: 0.3s; }
        .btn-back:hover { color: var(--text-main); }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.9rem; margin-bottom: 8px; color: var(--text-muted); }
        
        .input-field {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            padding: 12px 15px;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }
        .input-field:focus { border-color: var(--primary); }

        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255,255,255,0.02);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
            margin-bottom: 15px;
        }

        /* Toggle Switch Customizado */
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 30px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 4px; bottom: 4px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(24px); }

        .btn-save {
            width: 100%;
            background: var(--primary);
            color: #020617;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-save:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .color-picker { height: 45px; padding: 5px; cursor: pointer; }

    </style>
</head>
<body>

    <div class="edit-container">
        <div class="header">
            <h1>Editar Perfil</h1>
            <a href="profile.html" class="btn-back"><i data-feather="x"></i></a>
        </div>

        <div class="form-group">
            <label>Apelido (Nome de Exibição)</label>
            <input type="text" id="nicknameInput" class="input-field" placeholder="Como quer ser chamado?">
        </div>

        <div class="form-group">
            <label>URL da Foto de Perfil (Avatar)</label>
            <input type="text" id="avatarInput" class="input-field" placeholder="https://link-da-sua-foto.png">
        </div>

        <div class="form-group">
            <label>URL da Imagem do Banner (Opcional)</label>
            <input type="text" id="bannerImgInput" class="input-field" placeholder="https://link-do-seu-banner.png">
        </div>

        <div class="form-group">
            <label>Cor do Banner (Se não tiver imagem)</label>
            <input type="color" id="bannerColorInput" class="input-field color-picker" value="#38bdf8">
        </div>

        <div class="toggle-group">
            <div>
                <strong>Ocultar Nick Original</strong>
                <div style="font-size: 0.8rem; color: var(--text-muted);">Exibe apenas o seu apelido no perfil.</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="hideNickToggle">
                <span class="slider"></span>
            </label>
        </div>

        <div class="toggle-group">
            <div>
                <strong>Privar E-mail</strong>
                <div style="font-size: 0.8rem; color: var(--text-muted);">Esconde seu e-mail de visitantes.</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="privateEmailToggle" checked> <span class="slider"></span>
            </label>
        </div>

        <button class="btn-save" onclick="saveProfile()">Salvar Alterações</button>
    </div>

    <script>
        feather.replace();

        // Carrega os dados atuais do usuário ao abrir a página
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('evollogic_auth_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                // Reaproveitamos a rota /api/user/me para preencher os campos com o que ele já tem
                const response = await fetch('https://evollogic-backend-production.up.railway.app/api/user/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const data = await response.json();
                    if(data.nickname) document.getElementById('nicknameInput').value = data.nickname;
                    if(data.avatar) document.getElementById('avatarInput').value = data.avatar;
                    if(data.bannerImage) document.getElementById('bannerImgInput').value = data.bannerImage;
                    if(data.bannerColor) document.getElementById('bannerColorInput').value = data.bannerColor;
                    
                    document.getElementById('hideNickToggle').checked = data.hideNick || false;
                    
                    // Se privateEmail vier da API a gente usa, senão mantém o padrão True (marcado)
                    if(data.privateEmail !== undefined) {
                        document.getElementById('privateEmailToggle').checked = data.privateEmail;
                    }
                }
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
            }
        });

        // Salvar os dados na nova rota da API
        async function saveProfile() {
            const btn = document.querySelector('.btn-save');
            btn.innerText = "Salvando...";
            btn.style.opacity = "0.7";

            const payload = {
                nickname: document.getElementById('nicknameInput').value,
                avatar: document.getElementById('avatarInput').value,
                bannerImage: document.getElementById('bannerImgInput').value,
                bannerColor: document.getElementById('bannerColorInput').value,
                hideNick: document.getElementById('hideNickToggle').checked,
                privateEmail: document.getElementById('privateEmailToggle').checked
            };

            const token = localStorage.getItem('evollogic_auth_token');

            try {
                const response = await fetch('https://evollogic-backend-production.up.railway.app/api/user/edit', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                if (response.ok) {
                    alert("Perfil salvo com sucesso!");
                    window.location.href = 'profile.html'; // Volta pro perfil para ele ver o resultado
                } else {
                    alert("Erro ao salvar: " + (result.error || "Desconhecido"));
                    btn.innerText = "Salvar Alterações";
                    btn.style.opacity = "1";
                }
            } catch (error) {
                alert("Erro de conexão com o servidor.");
                btn.innerText = "Salvar Alterações";
                btn.style.opacity = "1";
            }
        }
    </script>
</body>
</html>
