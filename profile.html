<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evollogic - Perfil</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        /* ... SEU CSS ORIGINAL MANTIDO INTACTO ... */
        :root {
            --bg-dark: #020617;
            --bg-card: #151c2c;
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #7dd3fc;
            --danger: #f87171;
            --like: #ec4899;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, rgba(0,0,0,0) 70%);
            top: -200px;
            left: -200px;
            z-index: 0;
            pointer-events: none;
        }

        .mobile-header { display: none; }

        .overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            z-index: 15; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .overlay.show { opacity: 1; visibility: visible; }

        .sidebar {
            width: 260px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-glass); display: flex; flex-direction: column;
            padding: 30px 20px; z-index: 20; height: 100vh; box-sizing: border-box;
            position: sticky; top: 0; transition: all 0.3s ease;
        }

        .brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; padding-left: 10px; }
        .brand-logo { display: flex; align-items: center; gap: 15px; }
        .brand img { width: 40px; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        .brand h2 { font-size: 1.2rem; font-weight: 700; margin: 0; letter-spacing: 1px; }

        .close-menu-btn { display: none; background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 5px; }

        .nav-menu { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; flex: 1; overflow-y: auto; }
        .nav-link { display: flex; align-items: center; gap: 15px; padding: 12px 15px; border-radius: 12px; color: var(--text-muted); text-decoration: none; font-weight: 500; transition: all 0.3s ease; }
        .nav-link:hover, .nav-link.active { background: rgba(56, 189, 248, 0.1); color: var(--primary); }
        .nav-link i { width: 20px; }
        .logout-btn { color: var(--danger); margin-top: 5px; }
        .logout-btn:hover { background: rgba(248, 113, 113, 0.1); color: #fca5a5; }

        .sidebar-bottom { margin-top: auto; padding-top: 20px; border-top: 1px solid var(--border-glass); display: flex; flex-direction: column; gap: 15px; }

        .lang-selector { display: flex; background: rgba(0, 0, 0, 0.4); border-radius: 12px; padding: 6px; border: 1px solid rgba(255, 255, 255, 0.05); justify-content: space-between; }
        .lang-pill { padding: 8px 14px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; color: #64748b; cursor: pointer; transition: all 0.3s ease; flex: 1; text-align: center; }
        .lang-pill:hover:not(.active) { color: #f8fafc; }
        .lang-pill.active { background: var(--primary); color: #0f172a; box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3); }

        .main-content { flex: 1; padding: 50px 40px; z-index: 1; box-sizing: border-box; max-width: 900px; margin: 0 auto; animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .page-header { margin-bottom: 30px; }
        .page-header h1 { font-size: 2.2rem; font-weight: 700; margin: 0 0 8px 0; }
        .page-header p { color: var(--text-muted); margin: 0; font-size: 1.05rem; }

        .profile-card { background: var(--bg-card); border-radius: 24px; overflow: hidden; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.03); margin-bottom: 30px; }
        .profile-banner { height: 160px; background-color: var(--primary); width: 100%; }
        .profile-content { display: flex; flex-direction: column; align-items: center; padding: 0 30px 40px 30px; margin-top: -65px; }
        .profile-avatar { width: 130px; height: 130px; border-radius: 50%; border: 6px solid var(--bg-card); background: #fff; object-fit: cover; box-shadow: 0 8px 20px rgba(0,0,0,0.4); margin-bottom: 15px; }
        .profile-name { font-size: 1.8rem; font-weight: 700; margin: 0 0 5px 0; text-align: center; }
        .profile-email { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 1rem; margin: 0 0 20px 0; }
        .profile-email i { width: 16px; height: 16px; }

        .join-date { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 0.9rem; margin: 0 0 20px 0; background: rgba(255,255,255,0.03); padding: 8px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .join-date i { width: 16px; height: 16px; color: var(--primary); }

        .profile-stats { display: flex; gap: 40px; margin-bottom: 30px; }
        .stat-item { text-align: center; font-size: 0.95rem; color: var(--text-muted); cursor: pointer; transition: transform 0.2s ease, color 0.2s ease; padding: 5px 10px; border-radius: 12px; }
        .stat-item:hover { transform: translateY(-3px); background: rgba(255, 255, 255, 0.03); color: var(--text-main); }
        .stat-item strong { display: block; font-size: 1.4rem; color: var(--text-main); margin-bottom: 2px; }

        .profile-actions { display: flex; gap: 15px; flex-wrap: wrap; justify-content: center; }
        .btn-action { display: none; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 12px; font-family: 'Poppins', sans-serif; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: all 0.3s ease; border: 1px solid transparent; }
        .btn-edit { background: rgba(255, 255, 255, 0.05); color: var(--text-main); border-color: rgba(255, 255, 255, 0.1); }
        .btn-edit:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
        .btn-follow { background: var(--primary); color: #020617; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2); }
        .btn-follow:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4); }
        
        .btn-unfollow { background: rgba(248, 113, 113, 0.1); color: var(--danger); border-color: rgba(248, 113, 113, 0.3); box-shadow: none; }
        .btn-unfollow:hover { background: var(--danger); color: #fff; transform: translateY(-2px); }

        .post-area { display: none; background: var(--bg-card); border-radius: 24px; padding: 30px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2); border: 1px solid rgba(255, 255, 255, 0.03); animation: fadeIn 0.6s ease; }
        .post-area h3 { margin: 0 0 20px 0; font-size: 1.2rem; display: flex; align-items: center; gap: 10px; }

        .post-composer { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 15px; margin-bottom: 30px; }
        .post-composer textarea { width: 100%; background: transparent; border: none; color: var(--text-main); font-family: 'Poppins', sans-serif; font-size: 0.95rem; resize: none; outline: none; min-height: 80px; box-sizing: border-box; }
        .composer-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; }
        .btn-publish { background: var(--primary); color: #020617; border: none; padding: 8px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .btn-publish:hover { background: var(--primary-hover); }

        .feed-post { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; margin-bottom: 15px; position: relative; animation: fadeIn 0.5s ease; }
        .feed-header { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
        .feed-header img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; }
        .feed-author strong { display: block; font-size: 1rem; }
        .feed-author span { color: var(--text-muted); font-size: 0.85rem; }
        .feed-content { font-size: 0.95rem; line-height: 1.6; color: #e2e8f0; margin-bottom: 15px; word-wrap: break-word; }
        
        .feed-actions { display: flex; gap: 15px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; position: relative; }
        .btn-like { background: transparent; border: none; color: var(--text-muted); display: flex; align-items: center; gap: 6px; cursor: pointer; font-family: 'Poppins', sans-serif; font-size: 0.9rem; transition: color 0.3s ease; padding: 0; outline: none; }
        .btn-like.liked { color: var(--like); }
        .btn-like.liked i { fill: var(--like); animation: bouncePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes bouncePop { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 70% { transform: scale(0.8); } 100% { transform: scale(1); } }
        
        /* Física melhorada para as partículas explodirem */
        .floating-heart { position: absolute; pointer-events: none; z-index: 100; animation: fluidFloat 1s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
        @keyframes fluidFloat { 
            0% { transform: translate(0, 0) scale(0) rotate(0deg); opacity: 1; } 
            20% { transform: translate(calc(var(--tx) * 0.4), calc(var(--ty) * 0.4)) scale(1.2) rotate(calc(var(--rot) / 2)); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0.5) rotate(var(--rot)); opacity: 0; } 
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            .mobile-header { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-glass); position: sticky; top: 0; z-index: 10; }
            .mobile-menu-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-main); cursor: pointer; padding: 8px; border-radius: 8px; display: flex; }
            .sidebar { position: fixed; top: 0; left: -300px; width: 280px; height: 100dvh; z-index: 20; transition: 0.3s ease; box-shadow: none; padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 30px); }
            .sidebar.show { left: 0; box-shadow: 10px 0 30px rgba(0,0,0,0.5); }
            .close-menu-btn { display: block; }
            .main-content { padding: 30px 20px; }
            .profile-banner { height: 120px; }
            .profile-avatar { width: 110px; height: 110px; margin-top: -55px; }
            .profile-stats { gap: 20px; }
        }
    </style>
</head>
<body>

    <div class="mobile-header">
        <div class="brand-logo">
            <img src="https://i.imgur.com/31WnC6D.png" alt="Evollogic Logo" style="width: 35px;">
            <h2 style="margin: 0 0 0 10px; font-size: 1.2rem; font-weight: 700;">Evollogic</h2>
        </div>
        <button class="mobile-menu-btn" onclick="toggleMenu()"><i data-feather="menu"></i></button>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <div class="brand-logo">
                <img src="https://i.imgur.com/31WnC6D.png" alt="Evollogic Logo">
                <h2>Evollogic</h2>
            </div>
            <button class="close-menu-btn" onclick="toggleMenu()"><i data-feather="x"></i></button>
        </div>

        <ul class="nav-menu">
            <li><a href="index.html" class="nav-link"><i data-feather="grid"></i> <span data-i18n="nav_hub">Hub Central</span></a></li>
            <li><a href="profile.html" class="nav-link active"><i data-feather="user"></i> <span data-i18n="nav_profile">Meu Perfil</span></a></li>
            <li id="navStatics" style="display: none;"><a href="Statics.html" class="nav-link"><i data-feather="bar-chart-2"></i> <span data-i18n="nav_statics">Estatísticas</span></a></li>
            <li><a href="#" class="nav-link"><i data-feather="shield"></i> <span data-i18n="nav_security">Segurança</span></a></li>
            <li><a href="#" class="nav-link"><i data-feather="settings"></i> <span data-i18n="nav_settings">Configurações</span></a></li>
        </ul>

        <div class="sidebar-bottom">
            <div class="lang-selector">
                <div class="lang-pill" data-lang="PT" onclick="changeLang(this)">PT</div>
                <div class="lang-pill" data-lang="EN" onclick="changeLang(this)">EN</div>
                <div class="lang-pill" data-lang="ES" onclick="changeLang(this)">ES</div>
            </div>
            <a href="#" class="nav-link logout-btn" onclick="logout()">
                <i data-feather="log-out"></i> <span data-i18n="nav_logout">Sair da conta</span>
            </a>
        </div>
    </aside>

    <main class="main-content">
        
        <div class="page-header">
            <h1 data-i18n="page_title" id="dynamicTitle">Visão Geral</h1>
            <p data-i18n="page_desc" id="dynamicDesc">Gerencie suas informações pessoais e segurança.</p>
        </div>

        <div class="profile-card">
            <div class="profile-banner" id="userBanner"></div>
            
            <div class="profile-content">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Carregando" alt="Avatar do Usuário" class="profile-avatar" id="userAvatar">
                
                <h2 class="profile-name" id="userName">Carregando...</h2>
                
                <p class="profile-email">
                    <i data-feather="mail"></i> 
                    <span id="userEmail">carregando@...</span>
                </p>

                <div class="join-date">
                    <i data-feather="calendar"></i>
                    <span data-i18n="join_date">Membro desde</span> <span id="userDate">--</span>
                </div>

                <div class="profile-stats">
                    <div class="stat-item" onclick="openFollowPage('followers')">
                        <strong id="followersCount">0</strong> 
                        <span data-i18n="stat_followers">Seguidores</span>
                    </div>
                    <div class="stat-item" onclick="openFollowPage('following')">
                        <strong id="followingCount">0</strong> 
                        <span data-i18n="stat_following">Seguindo</span>
                    </div>
                </div>

                <div class="profile-actions">
                    <button id="btnEditProfile" class="btn-action btn-edit" onclick="window.location.href='profile_edit.html'">
                        <i data-feather="edit-2" style="width: 16px;"></i> <span data-i18n="btn_edit">Editar Perfil</span>
                    </button>
                    <button id="btnFollowUser" class="btn-action btn-follow" onclick="toggleFollow()">
                        <i data-feather="user-plus" style="width: 16px;"></i> <span id="textFollowBtn" data-i18n="btn_follow">Seguir</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="post-area" id="postArea">
            <h3><i data-feather="edit-3"></i> <span data-i18n="post_title">Publicações</span></h3>
            
            <div class="post-composer" id="composerArea">
                <textarea id="postInput" placeholder="O que você deseja compartilhar hoje?"></textarea>
                
                <div id="imagePreviewContainer" style="display:none; margin: 10px 0; position: relative;">
                    <img id="imagePreview" style="width: 100%; border-radius: 12px; max-height: 300px; object-fit: cover;">
                    <button onclick="clearImage()" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.5); border: none; color: white; border-radius: 50%; width: 30px; height: 30px; cursor: pointer;">×</button>
                </div>
            
                <div class="composer-actions">
                    <label for="imageInput" style="cursor: pointer; color: var(--primary); display: flex; align-items: center; gap: 5px;">
                        <i data-feather="image"></i> <span>Foto</span>
                        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="previewImage(this)">
                    </label>
                    <button class="btn-publish" onclick="submitPost()">
                        <i data-feather="send"></i> <span>Publicar</span>
                    </button>
                </div>
            </div>

            <div id="realPostsContainer"></div>

        </div>

    </main>

    <script>
        feather.replace();

        let currentImageBase64 = null;
        let loggedInUserId = null; 
        let targetProfileId = null;

        function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('show');
            document.getElementById('overlay').classList.toggle('show');
        }

        const translations = {
            PT: {
                nav_hub: "Hub Central",
                nav_profile: "Meu Perfil",
                nav_security: "Segurança",
                nav_settings: "Configurações",
                nav_logout: "Sair da conta",
                nav_statics: "Estatísticas",
                page_title: "Visão Geral",
                page_desc: "Gerencie suas informações pessoais e segurança.",
                page_title_other: "Perfil do Usuário",
                page_desc_other: "Conecte-se e veja o perfil deste membro.",
                join_date: "Membro desde",
                stat_followers: "Seguidores",
                stat_following: "Seguindo",
                btn_edit: "Editar Perfil",
                btn_follow: "Seguir",
                btn_unfollow: "Remover",
                post_title: "Publicações",
                post_placeholder: "O que você deseja compartilhar hoje?",
                btn_publish: "Publicar",
                private_email: "E-mail Privado",
                no_posts: "Nenhuma publicação ainda."
            },
            EN: { /* ... */ }
        };

        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.innerHTML = translations[lang][key];
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
                const key = element.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    element.placeholder = translations[lang][key];
                }
            });
        }

        function formatDate(dateString) {
            if (!dateString) return '--';
            const date = new Date(dateString);
            const lang = localStorage.getItem('userLanguage') || 'PT';
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            if (lang === 'EN') return date.toLocaleDateString('en-US', options);
            if (lang === 'ES') return date.toLocaleDateString('es-ES', options);
            return date.toLocaleDateString('pt-BR', options);
        }

        function changeLang(element) {
            document.querySelectorAll('.lang-pill').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            const selectedLang = element.getAttribute('data-lang');
            localStorage.setItem('userLanguage', selectedLang);
            applyTranslations(selectedLang);
        }

        function loadSavedLanguage() {
            const savedLang = localStorage.getItem('userLanguage') || 'PT';
            const targetPill = document.querySelector(`.lang-pill[data-lang="${savedLang}"]`);
            if (targetPill) {
                document.querySelectorAll('.lang-pill').forEach(el => el.classList.remove('active'));
                targetPill.classList.add('active');
            }
            applyTranslations(savedLang);
        }

        function previewImage(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentImageBase64 = e.target.result;
                    document.getElementById('imagePreview').src = currentImageBase64;
                    document.getElementById('imagePreviewContainer').style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        function clearImage() {
            currentImageBase64 = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewContainer').style.display = 'none';
        }

        async function submitPost() {
            const content = document.getElementById('postInput').value;
            const token = localStorage.getItem('evollogic_auth_token');
            
            if (!content.trim() && !currentImageBase64) {
                return alert('Escreva algo ou adicione uma foto!');
            }

            try {
                const response = await fetch('https://evollogic-backend-production.up.railway.app/api/posts/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                    body: JSON.stringify({ content: content, image: currentImageBase64, authorId: loggedInUserId })
                });

                if (response.ok) {
                    document.getElementById('postInput').value = '';
                    clearImage();
                    loadPosts(targetProfileId); // Recarrega o feed após postar
                } else {
                    alert('Erro ao publicar.');
                }
            } catch (error) {
                alert('Erro de conexão.');
            }
        }

        // ==========================================
        // PUXAR POSTS REAIS DO BANCO DE DADOS
        // ==========================================
        async function loadPosts(userId) {
            const token = localStorage.getItem('evollogic_auth_token');
            const container = document.getElementById('realPostsContainer');
            container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Carregando publicações...</p>';

            try {
                const response = await fetch(`https://evollogic-backend-production.up.railway.app/api/posts/user/${userId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const posts = await response.json();
                    container.innerHTML = ''; // Limpa o "Carregando..."

                    if (posts.length === 0) {
                        container.innerHTML = `<p style="text-align:center; color: var(--text-muted); margin-top: 20px;">Nenhuma publicação ainda.</p>`;
                        return;
                    }

                    posts.forEach(post => {
                        const isLikedByMe = post.likes.includes(loggedInUserId);
                        const likeClass = isLikedByMe ? 'liked' : '';
                        
                        // Garante que se não tiver like, mostra 0 em vez de nada.
                        const likeCount = post.likes.length || 0; 
                        
                        const authorName = post.author.nickname || post.author.name || 'Usuário';
                        const authorAvatar = post.author.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${authorName}`;

                        let imageHtml = '';
                        if (post.image) {
                            imageHtml = `<img src="${post.image}" style="width: 100%; border-radius: 12px; margin-top: 10px; max-height: 400px; object-fit: cover;">`;
                        }

                        const postElement = document.createElement('div');
                        postElement.className = 'feed-post';
                        postElement.innerHTML = `
                            <div class="feed-header">
                                <img src="${authorAvatar}" alt="Autor">
                                <div class="feed-author">
                                    <strong>${authorName}</strong>
                                    <span>${formatDate(post.createdAt)}</span>
                                </div>
                            </div>
                            <div class="feed-content">
                                ${post.content}
                                ${imageHtml}
                            </div>
                            <div class="feed-actions">
                                <button class="btn-like ${likeClass}" onclick="toggleLike(this, event, '${post._id}')">
                                    <i data-feather="heart" style="width: 16px;"></i> <span>${likeCount}</span>
                                </button>
                            </div>
                        `;
                        container.appendChild(postElement);
                    });
                    feather.replace(); // Recarrega os ícones
                }
            } catch (error) {
                container.innerHTML = '<p style="text-align:center; color: var(--danger);">Erro ao carregar publicações.</p>';
            }
        }

        // ==========================================
        // LÓGICA DE LIKES (ÁUDIO PREMIUM E ANIMAÇÃO EXPLOSIVA)
        // ==========================================
        // Áudio de pop limpo e premium (Mixkit/Sfx)
        const likeAudio = new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3');
        likeAudio.volume = 0.4;

        async function toggleLike(btn, event, postId) {
            // Animação imediata no frontend para ser rápido (Frenético)
            btn.classList.toggle('liked');
            const span = btn.querySelector('span');
            let count = parseInt(span.innerText);
            
            if (btn.classList.contains('liked')) {
                span.innerText = count + 1;
                createLikeParticles(btn, event);
            } else {
                span.innerText = count - 1;
            }

            // Envia para o banco de dados em background
            const token = localStorage.getItem('evollogic_auth_token');
            try {
                await fetch(`https://evollogic-backend-production.up.railway.app/api/posts/like/${postId}`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ userId: loggedInUserId })
                });
            } catch (error) {
                console.error('Erro ao registrar like', error);
            }
        }

        function createLikeParticles(btn, event) {
            // Toca o som reiniciando o timer para permitir cliques rápidos
            likeAudio.currentTime = 0;
            likeAudio.play().catch(()=>{}); 

            const rect = btn.getBoundingClientRect();
            const colors = ['#ec4899', '#f43f5e', '#38bdf8', '#8b5cf6', '#fb7185']; 
            
            // Aumentei de 10 para 15 partículas para mais impacto
            for (let i = 0; i < 15; i++) { 
                const particle = document.createElement('div');
                particle.className = 'floating-heart';
                
                const size = Math.random() * 12 + 8;
                particle.innerHTML = `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`;
                particle.style.color = colors[Math.floor(Math.random() * colors.length)];
                
                document.body.appendChild(particle);

                // Física de explosão radial com maior alcance
                const angle = (Math.random() * Math.PI * 2); 
                const distance = Math.random() * 100 + 40; // Voam mais longe
                const tx = Math.cos(angle) * distance + 'px'; 
                const ty = Math.sin(angle) * distance - 40 + 'px'; // Tendência de subir um pouco
                const rot = (Math.random() * 360) + 'deg'; 

                particle.style.setProperty('--tx', tx);
                particle.style.setProperty('--ty', ty);
                particle.style.setProperty('--rot', rot);
                
                const x = event.clientX || rect.left + rect.width / 2;
                const y = event.clientY || rect.top + rect.height / 2;

                particle.style.left = `${x - size/2}px`;
                particle.style.top = `${y - size/2}px`;

                setTimeout(() => particle.remove(), 1000);
            }
        }

        function openFollowPage(tab) { /* ... Igual ao Original ... */ }

        document.addEventListener('DOMContentLoaded', async () => {
            loadSavedLanguage();

            const token = localStorage.getItem('evollogic_auth_token');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const urlParams = new URLSearchParams(window.location.search);
                const queryId = urlParams.get('id');

                const meResponse = await fetch('https://evollogic-backend-production.up.railway.app/api/user/me', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!meResponse.ok) throw new Error('Sessão expirada');
                const myData = await meResponse.json();
                
                loggedInUserId = myData._id || myData.id; 
                targetProfileId = queryId || loggedInUserId;
                
                if (parseInt(myData.mode || '0') > 2) {
                    document.getElementById('navStatics').style.display = 'block';
                }

                const isOwnProfile = !queryId || queryId === String(loggedInUserId);
                let profileDataToDisplay = myData;

                if (!isOwnProfile) {
                    const targetResponse = await fetch(`https://evollogic-backend-production.up.railway.app/api/user/${queryId}`, {
                        method: 'GET',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });

                    if (targetResponse.ok) {
                        profileDataToDisplay = await targetResponse.json();
                    } else {
                        alert('Perfil não encontrado!');
                        window.location.href = 'profile.html';
                        return;
                    }
                }

                // UI setup (botões, nomes, avatares)
                if (isOwnProfile) {
                    document.getElementById('btnEditProfile').style.display = 'flex';
                    document.getElementById('btnFollowUser').style.display = 'none';
                    document.getElementById('composerArea').style.display = 'block';
                } else {
                    document.getElementById('btnEditProfile').style.display = 'none';
                    document.getElementById('composerArea').style.display = 'none';
                    document.getElementById('btnFollowUser').style.display = 'flex';
                }

                const displayName = (profileDataToDisplay.hideNick && profileDataToDisplay.nickname && profileDataToDisplay.nickname.trim() !== '') 
                    ? profileDataToDisplay.nickname 
                    : (profileDataToDisplay.name || 'Sem Nome');
                
                document.getElementById('userName').textContent = displayName;
                document.getElementById('userEmail').textContent = profileDataToDisplay.privateEmail ? 'E-mail Privado' : (profileDataToDisplay.email || 'Conta Vinculada');
                document.getElementById('userAvatar').src = profileDataToDisplay.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${displayName}`;
                
                if (profileDataToDisplay.bannerImage) {
                    document.getElementById('userBanner').style.backgroundImage = `url(${profileDataToDisplay.bannerImage})`;
                    document.getElementById('userBanner').style.backgroundSize = 'cover';
                } else if (profileDataToDisplay.bannerColor) {
                    document.getElementById('userBanner').style.backgroundColor = profileDataToDisplay.bannerColor;
                }
                
                window.globalCreatedAt = profileDataToDisplay.createdAt || new Date();
                document.getElementById('userDate').textContent = formatDate(window.globalCreatedAt);

                document.getElementById('followersCount').textContent = profileDataToDisplay.followers ? profileDataToDisplay.followers.length : 0;
                document.getElementById('followingCount').textContent = profileDataToDisplay.following ? profileDataToDisplay.following.length : 0;

                // Mostra a área de posts e CARREGA OS POSTS REAIS DO BANCO
                const userMode = String(profileDataToDisplay.mode || '0');
                if (userMode === '+1' || parseInt(userMode) >= 1) {
                    document.getElementById('postArea').style.display = 'block';
                    loadPosts(targetProfileId); // <<< CHAMADA PARA PUXAR OS POSTS
                } else {
                    document.getElementById('postArea').style.display = 'none';
                }

            } catch (error) {
                console.error(error);
                localStorage.removeItem('evollogic_auth_token');
                window.location.href = 'login.html';
            }
        });

        function logout() {
            if(confirm("Tem certeza que deseja sair?")) {
                localStorage.removeItem('evollogic_auth_token');
                window.location.href = 'login.html'; 
            }
        }
