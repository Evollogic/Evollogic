<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evollogic - Perfil</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        :root {
            --bg-dark: #020617;
            --bg-card: #151c2c;
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #7dd3fc;
            --danger: #f87171;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, rgba(0,0,0,0) 70%);
            top: -200px;
            left: -200px;
            z-index: 0;
            pointer-events: none;
        }

        /* =============================
           MENU LATERAL (SIDEBAR)
        ============================= */
        .sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            z-index: 20;
            height: 100vh;
            box-sizing: border-box;
            position: sticky;
            top: 0;
            transition: all 0.3s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            padding-left: 10px;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand img {
            width: 40px;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .brand h2 {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 1px;
        }

        .mobile-menu-btn {
            display: none;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-main);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
        }

        .nav-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            border-radius: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-link:hover, .nav-link.active {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
        }

        .nav-link i { width: 20px; }

        .logout-btn { color: var(--danger); }
        .logout-btn:hover { background: rgba(248, 113, 113, 0.1); color: #fca5a5; }

        /* =============================
           SELETOR DE IDIOMAS NA SIDEBAR
        ============================= */
        .sidebar-bottom {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px solid var(--border-glass);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .lang-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 10px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            justify-content: space-between;
        }

        .lang-pill {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s ease;
            flex: 1;
            text-align: center;
        }

        .lang-pill:hover:not(.active) { color: #f8fafc; }
        .lang-pill.active {
            background: var(--primary);
            color: #0f172a;
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }

        /* =============================
           ÁREA PRINCIPAL (PERFIL)
        ============================= */
        .main-content {
            flex: 1;
            padding: 50px 40px;
            z-index: 1;
            box-sizing: border-box;
            max-width: 900px;
            margin: 0 auto;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .page-header { margin-bottom: 30px; }
        .page-header h1 { font-size: 2.2rem; font-weight: 700; margin: 0 0 8px 0; }
        .page-header p { color: var(--text-muted); margin: 0; font-size: 1.05rem; }

        /* CARD */
        .profile-card {
            background: var(--bg-card);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .profile-banner {
            height: 160px;
            background: var(--primary);
            width: 100%;
        }

        .profile-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 30px 40px 30px;
            margin-top: -65px;
        }

        .profile-avatar {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 6px solid var(--bg-card);
            background: #fff;
            object-fit: cover;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            margin-bottom: 15px;
        }

        .profile-name { font-size: 1.8rem; font-weight: 700; margin: 0 0 5px 0; text-align: center; }
        .profile-email { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 1rem; margin: 0 0 25px 0; }
        .profile-email i { width: 16px; height: 16px; }

        .btn-edit {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 24px;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-edit:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* =============================
           RESPONSIVIDADE (CELULAR)
        ============================= */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
                padding: 15px 20px;
                border-right: none;
                border-bottom: 1px solid var(--border-glass);
            }

            .brand { margin-bottom: 0; }
            .mobile-menu-btn { display: block; }

            .nav-menu, .sidebar-bottom { 
                display: none; /* Esconde no celular até clicar no botão */
            }

            .nav-menu.show, .sidebar-bottom.show {
                display: flex; /* Mostra quando clica */
                margin-top: 20px;
            }

            .main-content { padding: 30px 20px; }
            .profile-banner { height: 120px; }
            .profile-avatar { width: 110px; height: 110px; margin-top: -55px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <div class="brand-logo">
                <img src="https://i.imgur.com/31WnC6D.png" alt="Evollogic Logo">
                <h2>Evollogic</h2>
            </div>
            <button class="mobile-menu-btn" onclick="toggleMenu()">
                <i data-feather="menu"></i>
            </button>
        </div>

        <ul class="nav-menu" id="navMenu">
            <li>
                <a href="index.html" class="nav-link">
                    <i data-feather="grid"></i> <span data-i18n="nav_hub">Hub Central</span>
                </a>
            </li>
            <li>
                <a href="profile.html" class="nav-link active">
                    <i data-feather="user"></i> <span data-i18n="nav_profile">Meu Perfil</span>
                </a>
            </li>
            <li>
                <a href="#" class="nav-link">
                    <i data-feather="shield"></i> <span data-i18n="nav_security">Segurança</span>
                </a>
            </li>
            <li>
                <a href="#" class="nav-link">
                    <i data-feather="settings"></i> <span data-i18n="nav_settings">Configurações</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-bottom" id="sidebarBottom">
            <div class="lang-selector">
                <div class="lang-pill" data-lang="PT" onclick="changeLang(this)">PT</div>
                <div class="lang-pill" data-lang="EN" onclick="changeLang(this)">EN</div>
                <div class="lang-pill" data-lang="ES" onclick="changeLang(this)">ES</div>
            </div>
            <a href="#" class="nav-link logout-btn" onclick="logout()">
                <i data-feather="log-out"></i> <span data-i18n="nav_logout">Sair da conta</span>
            </a>
        </div>
    </aside>

    <main class="main-content">
        
        <div class="page-header">
            <h1 data-i18n="page_title">Visão Geral</h1>
            <p data-i18n="page_desc">Gerencie suas informações pessoais e segurança.</p>
        </div>

        <div class="profile-card">
            <div class="profile-banner"></div>
            
            <div class="profile-content">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Carregando" alt="Avatar do Usuário" class="profile-avatar" id="userAvatar">
                
                <h2 class="profile-name" id="userName">Carregando...</h2>
                <p class="profile-email">
                    <i data-feather="mail"></i> 
                    <span id="userEmail">carregando@...</span>
                </p>

                <button class="btn-edit">
                    <i data-feather="edit-2" style="width: 16px;"></i> <span data-i18n="btn_edit">Editar Perfil</span>
                </button>
            </div>
        </div>

    </main>

    <script>
        feather.replace();

        // Menu Mobile
        function toggleMenu() {
            document.getElementById('navMenu').classList.toggle('show');
            document.getElementById('sidebarBottom').classList.toggle('show');
        }

        // ==========================================
        // SISTEMA DE TRADUÇÃO
        // ==========================================
        const translations = {
            PT: {
                nav_hub: "Hub Central",
                nav_profile: "Meu Perfil",
                nav_security: "Segurança",
                nav_settings: "Configurações",
                nav_logout: "Sair da conta",
                page_title: "Visão Geral",
                page_desc: "Gerencie suas informações pessoais e segurança.",
                btn_edit: "Editar Perfil"
            },
            EN: {
                nav_hub: "Central Hub",
                nav_profile: "My Profile",
                nav_security: "Security",
                nav_settings: "Settings",
                nav_logout: "Sign Out",
                page_title: "Overview",
                page_desc: "Manage your personal information and security.",
                btn_edit: "Edit Profile"
            },
            ES: {
                nav_hub: "Hub Central",
                nav_profile: "Mi Perfil",
                nav_security: "Seguridad",
                nav_settings: "Configuración",
                nav_logout: "Cerrar Sesión",
                page_title: "Visión General",
                page_desc: "Gestiona tu información personal y seguridad.",
                btn_edit: "Editar Perfil"
            }
        };

        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.innerText = translations[lang][key];
                }
            });
        }

        function changeLang(element) {
            document.querySelectorAll('.lang-pill').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            const selectedLang = element.getAttribute('data-lang');
            localStorage.setItem('userLanguage', selectedLang);
            applyTranslations(selectedLang);
        }

        function loadSavedLanguage() {
            const savedLang = localStorage.getItem('userLanguage') || 'PT';
            const targetPill = document.querySelector(`.lang-pill[data-lang="${savedLang}"]`);
            
            if (targetPill) {
                document.querySelectorAll('.lang-pill').forEach(el => el.classList.remove('active'));
                targetPill.classList.add('active');
            }
            applyTranslations(savedLang);
        }

        // ==========================================
        // CARREGAR DADOS DO USUÁRIO
        // ==========================================
        document.addEventListener('DOMContentLoaded', async () => {
            loadSavedLanguage();

            const urlParams = new URLSearchParams(window.location.search);
            const tokenFromUrl = urlParams.get('token');

            if (tokenFromUrl) {
                localStorage.setItem('evollogic_auth_token', tokenFromUrl);
                window.history.replaceState({}, document.title, window.location.pathname);
            }

            const token = localStorage.getItem('evollogic_auth_token');

            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            try {
                const response = await fetch('https://evollogic-backend-production.up.railway.app/api/user/me', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) throw new Error('Sessão expirada');

                const userData = await response.json();
                document.getElementById('userName').textContent = userData.name || 'Sem Nome';
                document.getElementById('userEmail').textContent = userData.email || 'Conta Vinculada';
                
                if (userData.avatar) {
                    document.getElementById('userAvatar').src = userData.avatar;
                }
            } catch (error) {
                localStorage.removeItem('evollogic_auth_token');
                window.location.href = 'login.html';
            }
        });

        function logout() {
            if(confirm("Tem certeza que deseja sair?")) {
                localStorage.removeItem('evollogic_auth_token');
                window.location.href = 'login.html'; 
            }
        }
    </script>
</body>
</html>
