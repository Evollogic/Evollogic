<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evollogic - Conexões</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        :root {
            --bg-dark: #020617;
            --bg-card: #151c2c;
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #7dd3fc;
            --danger: #f87171;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 25px;
            font-weight: 500;
            transition: 0.3s;
        }

        .back-link:hover { color: var(--primary); }

        .header-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 10px;
            border: 1px solid var(--border-glass);
            display: flex;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            cursor: pointer;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .user-item {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s ease;
        }

        .user-item:hover {
            border-color: rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex: 1;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-glass);
        }

        .user-details strong {
            display: block;
            font-size: 1rem;
            color: var(--text-main);
        }

        .user-details span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .action-btn {
            padding: 8px 16px;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .btn-follow {
            background: var(--primary);
            color: #020617;
        }

        .btn-follow:hover {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .btn-remove {
            background: rgba(248, 113, 113, 0.1);
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.2);
        }

        .btn-remove:hover {
            background: var(--danger);
            color: white;
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            display: block;
            margin-bottom: 10px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="profile.html" class="back-link">
            <i data-feather="arrow-left"></i> <span data-i18n="back_profile">Voltar ao perfil</span>
        </a>

        <div class="header-card">
            <button class="tab-btn active" id="tabFollowers" onclick="switchTab('followers')" data-i18n="tab_followers">Seguidores</button>
            <button class="tab-btn" id="tabFollowing" onclick="switchTab('following')" data-i18n="tab_following">Seguindo</button>
        </div>

        <div id="userList" class="list-container">
            <div class="empty-state" data-i18n="loading">Carregando conexões...</div>
        </div>
    </div>

    <script>
        feather.replace();

        const translations = {
            PT: {
                back_profile: "Voltar ao perfil",
                tab_followers: "Seguidores",
                tab_following: "Seguindo",
                loading: "Carregando conexões...",
                empty_followers: "Nenhum usuário encontrado em seguidores.",
                empty_following: "Nenhum usuário encontrado em seguindo.",
                btn_follow: "Seguir",
                btn_remove: "Remover"
            },
            EN: {
                back_profile: "Back to profile",
                tab_followers: "Followers",
                tab_following: "Following",
                loading: "Loading connections...",
                empty_followers: "No users found in followers.",
                empty_following: "No users found in following.",
                btn_follow: "Follow",
                btn_remove: "Remove"
            },
            ES: {
                back_profile: "Volver al perfil",
                tab_followers: "Seguidores",
                tab_following: "Siguiendo",
                loading: "Cargando conexiones...",
                empty_followers: "No se encontraron usuarios en seguidores.",
                empty_following: "No se encontraron usuarios en siguiendo.",
                btn_follow: "Seguir",
                btn_remove: "Eliminar"
            }
        };

        function applyTranslations() {
            const lang = localStorage.getItem('userLanguage') || 'PT';
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.innerHTML = translations[lang][key];
                }
            });
        }

        let currentTab = 'followers';
        let currentUserData = null;

        const urlParams = new URLSearchParams(window.location.search);
        const initialTab = urlParams.get('tab');
        if (initialTab === 'following') currentTab = 'following';

        async function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (tab === 'followers') {
                document.getElementById('tabFollowers').classList.add('active');
            } else {
                document.getElementById('tabFollowing').classList.add('active');
            }
            
            renderList();
        }

        function renderList() {
            const listElement = document.getElementById('userList');
            listElement.innerHTML = '';

            const list = (currentTab === 'followers') ? currentUserData.followers : currentUserData.following;
            const lang = localStorage.getItem('userLanguage') || 'PT';
            const t = translations[lang];

            if (!list || list.length === 0) {
                listElement.innerHTML = `
                    <div class="empty-state">
                        <i data-feather="users" style="width: 48px; height: 48px; margin: 0 auto 10px;"></i>
                        <p>${currentTab === 'followers' ? t.empty_followers : t.empty_following}</p>
                    </div>
                `;
                feather.replace();
                return;
            }

            list.forEach(user => {
                const isPopulated = typeof user === 'object' && user !== null && user.name;
                
                const userId = isPopulated ? user._id : user;
                const name = isPopulated ? user.name : 'Usuário Oculto';
                const avatar = (isPopulated && user.avatar) ? user.avatar : `https://api.dicebear.com/7.x/avataaars/svg?seed=${userId}`;
                const nickname = (isPopulated && user.nickname) ? user.nickname : 'membro';

                const item = document.createElement('div');
                item.className = 'user-item';

                const alreadyFollowing = currentUserData.following && currentUserData.following.some(f => {
                    const fId = typeof f === 'object' ? f._id : f;
                    return String(fId) === String(userId);
                });

                let buttonHtml = '';
                if (currentTab === 'following') {
                    buttonHtml = `<button class="action-btn btn-remove" onclick="handleAction('${userId}', 'unfollow', event)">${t.btn_remove}</button>`;
                } else {
                    if (alreadyFollowing) {
                        buttonHtml = `<button class="action-btn btn-remove" onclick="handleAction('${userId}', 'unfollow', event)">${t.btn_remove}</button>`;
                    } else {
                        buttonHtml = `<button class="action-btn btn-follow" onclick="handleAction('${userId}', 'follow', event)">${t.btn_follow}</button>`;
                    }
                }

                item.innerHTML = `
                    <div class="user-info" onclick="goToProfile('${userId}')">
                        <img src="${avatar}" class="user-avatar" alt="Avatar">
                        <div class="user-details">
                            <strong>${name}</strong>
                            <span>@${nickname}</span>
                        </div>
                    </div>
                    <div class="user-actions">
                        ${buttonHtml}
                    </div>
                `;
                listElement.appendChild(item);
            });
        }

        function goToProfile(id) {
            window.location.href = `profile.html?id=${id}`;
        }

        async function handleAction(targetId, type, event) {
            // Isso impede que o clique no botão ative também o clique na div do usuário
            if(event) event.stopPropagation(); 
            
            const token = localStorage.getItem('evollogic_auth_token');
            try {
                const response = await fetch(`https://evollogic-backend-production.up.railway.app/api/follow/${targetId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    // MÁGICA AQUI: Redireciona para o perfil da pessoa loga após seguir/remover!
                    window.location.href = `profile.html?id=${targetId}`;
                } else {
                    console.error("Erro na resposta do servidor.");
                }
            } catch (error) {
                console.error("Erro na ação:", error);
            }
        }

        async function fetchUserData() {
            const token = localStorage.getItem('evollogic_auth_token');
            if (!token) { window.location.href = 'login.html'; return; }

            try {
                const response = await fetch('https://evollogic-backend-production.up.railway.app/api/user/me', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    currentUserData = await response.json();
                    switchTab(currentTab); 
                } else {
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyTranslations();
            fetchUserData();
            
            window.addEventListener('storage', (e) => {
                if (e.key === 'userLanguage') {
                    applyTranslations();
                    if(currentUserData) renderList(); 
                }
            });
        });
    </script>
</body>
</html>
