<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evollogic - Conexões</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        :root {
            --bg-dark: #020617;
            --bg-card: #151c2c;
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #7dd3fc;
            --danger: #f87171;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 500px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .back-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            text-decoration: none;
            margin-bottom: 25px;
            font-weight: 500;
            transition: 0.3s;
        }

        .back-link:hover { color: var(--primary); }

        .header-card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 10px;
            border: 1px solid var(--border-glass);
            display: flex;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            cursor: pointer;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
        }

        .list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .user-item {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-glass);
            border-radius: 20px;
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s ease;
        }

        .user-item:hover {
            border-color: rgba(56, 189, 248, 0.3);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            flex: 1;
        }

        .user-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border-glass);
        }

        .user-details strong {
            display: block;
            font-size: 1rem;
            color: var(--text-main);
        }

        .user-details span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .action-btn {
            padding: 8px 16px;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .btn-follow {
            background: var(--primary);
            color: #020617;
        }

        .btn-remove {
            background: rgba(248, 113, 113, 0.1);
            color: var(--danger);
            border-color: rgba(248, 113, 113, 0.2);
        }

        .btn-remove:hover {
            background: var(--danger);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
        }

        .empty-state i {
            display: block;
            margin-bottom: 10px;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="profile.html" class="back-link">
            <i data-feather="arrow-left"></i> Voltar ao perfil
        </a>

        <div class="header-card">
            <button class="tab-btn active" id="tabFollowers" onclick="switchTab('followers')">Seguidores</button>
            <button class="tab-btn" id="tabFollowing" onclick="switchTab('following')">Seguindo</button>
        </div>

        <div id="userList" class="list-container">
            <div class="empty-state">Carregando conexões...</div>
        </div>
    </div>

    <script>
        feather.replace();

        let currentTab = 'followers';
        let currentUserData = null;

        // Pega os parâmetros da URL para saber qual aba abrir primeiro
        const urlParams = new URLSearchParams(window.location.search);
        const initialTab = urlParams.get('tab');
        if (initialTab === 'following') currentTab = 'following';

        async function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            if (tab === 'followers') {
                document.getElementById('tabFollowers').classList.add('active');
            } else {
                document.getElementById('tabFollowing').classList.add('active');
            }
            
            renderList();
        }

        function renderList() {
            const listElement = document.getElementById('userList');
            listElement.innerHTML = '';

            const list = (currentTab === 'followers') ? currentUserData.followers : currentUserData.following;

            if (!list || list.length === 0) {
                listElement.innerHTML = `
                    <div class="empty-state">
                        <i data-feather="users" style="width: 48px; height: 48px; margin: 0 auto 10px;"></i>
                        <p>Nenhum usuário encontrado em ${currentTab === 'followers' ? 'seguidores' : 'seguindo'}.</p>
                    </div>
                `;
                feather.replace();
                return;
            }

            list.forEach(user => {
                // Aqui assumimos que o backend povoou (populated) os dados básicos do usuário
                const name = user.name || 'Usuário Evollogic';
                const avatar = user.avatar || `https://api.dicebear.com/7.x/avataaars/svg?seed=${user._id}`;
                const userId = user._id;

                const item = document.createElement('div');
                item.className = 'user-item';

                // Verifica se você já segue esse seguidor (apenas para a aba seguidores)
                const alreadyFollowing = currentUserData.following.some(f => f._id === userId);

                let buttonHtml = '';
                if (currentTab === 'following') {
                    buttonHtml = `<button class="action-btn btn-remove" onclick="handleAction('${userId}', 'unfollow')">Remover</button>`;
                } else {
                    if (alreadyFollowing) {
                        buttonHtml = `<button class="action-btn btn-remove" onclick="handleAction('${userId}', 'unfollow')">Remover</button>`;
                    } else {
                        buttonHtml = `<button class="action-btn btn-follow" onclick="handleAction('${userId}', 'follow')">Seguir</button>`;
                    }
                }

                item.innerHTML = `
                    <div class="user-info" onclick="goToProfile('${userId}')">
                        <img src="${avatar}" class="user-avatar" alt="Avatar">
                        <div class="user-details">
                            <strong>${name}</strong>
                            <span>@${user.nickname || 'evolloger'}</span>
                        </div>
                    </div>
                    <div class="user-actions">
                        ${buttonHtml}
                    </div>
                `;
                listElement.appendChild(item);
            });
        }

        function goToProfile(id) {
            window.location.href = `profile.html?id=${id}`;
        }

        async function handleAction(targetId, type) {
            const token = localStorage.getItem('evollogic_auth_token');
            try {
                // Chamada fictícia para sua rota de follow/unfollow
                const response = await fetch(`https://evollogic-backend-production.up.railway.app/api/follow/${targetId}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    // Recarrega os dados para atualizar a lista
                    fetchUserData();
                }
            } catch (error) {
                console.error("Erro na ação de follow:", error);
            }
        }

        async function fetchUserData() {
            const token = localStorage.getItem('evollogic_auth_token');
            if (!token) { window.location.href = 'login.html'; return; }

            try {
                // Buscamos o usuário logado (o backend precisa retornar followers/following populados)
                const response = await fetch('https://evollogic-backend-production.up.railway.app/api/user/me', {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    currentUserData = await response.json();
                    switchTab(currentTab); // Renderiza a aba atual
                } else {
                    window.location.href = 'login.html';
                }
            } catch (error) {
                console.error("Erro ao carregar dados:", error);
            }
        }

        document.addEventListener('DOMContentLoaded', fetchUserData);
    </script>
</body>
</html>
