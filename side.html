<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar - Configurações</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            height: calc(100vh - 40px);
            overflow: hidden;
            box-sizing: border-box;
        }

        .bottom-section {
            background: rgba(15, 23, 42, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }

        /* ==========================================
           BOTÃO DE PERFIL (Só aparece se logado)
           ========================================== */
        .profile-btn {
            display: none; /* Oculto por padrão, o JavaScript ativa */
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
            transition: all 0.3s ease;
        }

        .profile-btn:hover {
            background: #38bdf8;
            color: #020617;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.3);
            transform: translateY(-2px);
        }

        /* Linha divisória entre o botão e o idioma */
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
            width: 100%;
            display: none; /* Também fica oculta até o botão aparecer */
        }

        /* ==========================================
           SELETOR DE IDIOMAS (PILLS MODERNO)
           ========================================== */
        
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0;
        }

        .setting-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .lang-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 4px;
        }

        .lang-pill {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: 0.3s;
        }

        .lang-pill.active {
            background: #38bdf8;
            color: #020617;
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }

    </style>
</head>
<body>

    <div class="bottom-section">
        
        <!-- Botão que redireciona para a página de perfil (Oculto por padrão) -->
        <a href="profile.html" class="profile-btn" id="btnProfile" target="_parent">
            <i data-feather="user" style="width: 18px;"></i>
            <span data-i18n="nav_profile">Meu Perfil</span>
        </a>

        <div class="divider" id="menuDivider"></div>
        
        <div class="setting-row">
            <div class="setting-label">
                <i data-feather="globe" style="width: 18px;"></i> 
                <span data-i18n="lang_label">Idioma</span>
            </div>
            <div class="lang-selector">
                <div class="lang-pill" data-lang="PT" onclick="changeLang(this)">PT</div>
                <div class="lang-pill" data-lang="EN" onclick="changeLang(this)">EN</div>
                <div class="lang-pill" data-lang="ES" onclick="changeLang(this)">ES</div>
            </div>
        </div>

    </div>

    <script>
        feather.replace();

        // ==========================================
        // VERIFICAR LOGIN PARA MOSTRAR O BOTÃO
        // ==========================================
        function checkLoginStatus() {
            // Verifica se existe o token salvo do login
            const isLogged = localStorage.getItem('evollogic_auth_token');
            
            if (isLogged) {
                // Se tiver logado, mostra o botão e a linha divisória
                document.getElementById('btnProfile').style.display = 'flex';
                document.getElementById('menuDivider').style.display = 'block';
            }
        }

        // ==========================================
        // DICIONÁRIO DE TRADUÇÕES
        // ==========================================
        const translations = {
            PT: {
                lang_label: "Idioma",
                nav_profile: "Meu Perfil"
            },
            EN: {
                lang_label: "Language",
                nav_profile: "My Profile"
            },
            ES: {
                lang_label: "Idioma", 
                nav_profile: "Mi Perfil"
            }
        };

        // Função que aplica a tradução na página
        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.innerText = translations[lang][key];
                }
            });
        }

        // ==========================================
        // LÓGICA DO IDIOMA COM LOCALSTORAGE
        // ==========================================
        function changeLang(element) {
            document.querySelectorAll('.lang-pill').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            const selectedLang = element.getAttribute('data-lang');
            localStorage.setItem('userLanguage', selectedLang);

            applyTranslations(selectedLang);
        }

        function loadSavedLanguage() {
            const savedLang = localStorage.getItem('userLanguage') || 'PT';
            const targetPill = document.querySelector(`.lang-pill[data-lang="${savedLang}"]`);
            
            if (targetPill) {
                document.querySelectorAll('.lang-pill').forEach(el => el.classList.remove('active'));
                targetPill.classList.add('active');
            }

            applyTranslations(savedLang);
        }

        // Quando a página iniciar, carrega o idioma e checa se o usuário tá logado
        document.addEventListener('DOMContentLoaded', () => {
            loadSavedLanguage();
            checkLoginStatus();
        });

    </script>
</body>
</html>
