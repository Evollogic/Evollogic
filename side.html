<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar - Configurações</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            height: calc(100vh - 40px);
            overflow: hidden;
            box-sizing: border-box;
        }

        .bottom-section {
            background: rgba(15, 23, 42, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            margin: 2px 0;
        }

        /* ==========================================
           ÁREA DE CONTA (LOGIN / PERFIL) - CORRIGIDO
           ========================================== */
        
        .login-btn {
            display: flex;
            align-items: center;
            justify-content: center; /* Agora fica perfeitamente no centro */
            gap: 10px;
            padding: 14px;
            background: #38bdf8;
            color: #020617;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            width: 100%;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        .login-btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 1.2rem;
            position: relative;
        }

        .user-avatar::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            background: #10b981;
            border: 2px solid #0f172a;
            border-radius: 50%;
        }

        .user-info-text { display: flex; flex-direction: column; }
        .user-name { color: #f8fafc; font-weight: 600; font-size: 0.95rem; line-height: 1.2;}
        .user-status { color: #10b981; font-size: 0.75rem; font-weight: 500; }

        .logout-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: transparent;
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 10px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        .logout-btn:hover { background: rgba(239, 68, 68, 0.1); color: #f87171; }

        /* ==========================================
           NOVO SELETOR DE IDIOMAS (PILLS MODERNO)
           ========================================== */
        
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0;
        }

        .setting-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .lang-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 4px;
        }

        .lang-pill {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: 0.3s;
        }

        .lang-pill.active {
            background: #38bdf8;
            color: #020617;
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }

    </style>
</head>
<body>

    <div class="bottom-section">
        
        <div id="auth-container"></div>

        <div class="divider"></div>

        <div class="setting-row">
            <div class="setting-label">
                <i data-feather="globe" style="width: 18px;"></i> Idioma
            </div>
            <div class="lang-selector">
                <div class="lang-pill active" onclick="changeLang(this)">PT</div>
                <div class="lang-pill" onclick="changeLang(this)">EN</div>
                <div class="lang-pill" onclick="changeLang(this)">ES</div>
            </div>
        </div>

    </div>

    <script>
        feather.replace();

        // LÓGICA DE LOGIN (Perfeitamente Alinhado)
        let isLogged = false; 
        const authContainer = document.getElementById('auth-container');

        function renderAuthStatus() {
            if (isLogged) {
                authContainer.innerHTML = `
                    <div class="user-profile">
                        <div class="user-avatar">S</div>
                        <div class="user-info-text">
                            <span class="user-name">Sodhupn Admin</span>
                            <span class="user-status">Online</span>
                        </div>
                    </div>
                    <button class="logout-btn" onclick="toggleLogin()" style="margin-top: 12px;">
                        <i data-feather="log-out" style="width: 18px;"></i> Sair da Conta
                    </button>
                `;
            } else {
                authContainer.innerHTML = `
                    <button class="login-btn" onclick="toggleLogin()">
                        <i data-feather="log-in" style="width: 20px;"></i> Fazer Login
                    </button>
                `;
            }
            feather.replace();
        }

        function toggleLogin() {
            isLogged = !isLogged;
            renderAuthStatus();
        }

        renderAuthStatus(); 

        // LÓGICA DO NOVO IDIOMA
        function changeLang(element) {
            // Remove a classe active de todos
            document.querySelectorAll('.lang-pill').forEach(el => el.classList.remove('active'));
            // Adiciona no que foi clicado
            element.classList.add('active');
        }
    </script>
</body>
</html>
