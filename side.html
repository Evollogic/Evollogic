<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar - Configurações</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Empurra o conteúdo todo para baixo */
            height: 100vh;
            overflow: hidden;
        }

        /* ==========================================
           ÁREA DE CONFIGURAÇÕES (LÁ EMBAIXO)
           ========================================== */
        .bottom-section {
            padding: 20px;
            background: rgba(15, 23, 42, 0.5); 
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Estilo base dos botões */
        .menu-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid transparent;
            background: transparent;
            width: 100%;
            box-sizing: border-box;
            text-align: left;
        }

        .menu-item:hover, .menu-item.active {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
        }

        .settings-toggle {
            justify-content: space-between; 
        }

        .settings-toggle-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .settings-toggle svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s;
        }

        .arrow-icon {
            transition: transform 0.3s ease;
        }
        
        .settings-toggle.open .arrow-icon {
            transform: rotate(180deg);
        }

        /* Sub-menu (Idioma e Deslogar) */
        .settings-dropdown {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 0;
        }

        .settings-dropdown.open {
            max-height: 150px; 
            opacity: 1;
            margin-top: 10px;
        }

        .sub-menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 15px 10px 45px; 
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 10px;
            font-size: 0.95rem;
            transition: 0.3s;
        }

        .sub-menu-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
        }

        .sub-menu-item svg {
            width: 18px;
            height: 18px;
        }

        /* Botão específico de Deslogar */
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

    </style>
</head>
<body>

    <div class="bottom-section">
        <button class="menu-item settings-toggle" id="settings-btn">
            <div class="settings-toggle-content">
                <i data-feather="settings"></i> Configurações
            </div>
            <i data-feather="chevron-down" class="arrow-icon"></i>
        </button>

        <div class="settings-dropdown" id="settings-menu">
            <a href="#" class="sub-menu-item">
                <i data-feather="globe"></i> Idioma (PT-BR)
            </a>
            
            <a href="#" class="sub-menu-item logout-btn">
                <i data-feather="log-out"></i> Deslogar
            </a>
        </div>
    </div>

    <script>
        // Inicializa os ícones do Feather
        feather.replace();

        // Lógica do menu sanfona (Acordeão) das Configurações
        const settingsBtn = document.getElementById('settings-btn');
        const settingsMenu = document.getElementById('settings-menu');

        settingsBtn.addEventListener('click', () => {
            settingsBtn.classList.toggle('open');
            settingsMenu.classList.toggle('open');
        });
    </script>
</body>
</html>
