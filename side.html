<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar - Configurações</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            height: calc(100vh - 40px);
            overflow: hidden;
            box-sizing: border-box;
        }

        .bottom-section {
            background: rgba(15, 23, 42, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }

        /* ==========================================
           SELETOR DE IDIOMAS (PILLS MODERNO)
           ========================================== */
        
        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0;
        }

        .setting-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .lang-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 4px;
        }

        .lang-pill {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: 0.3s;
        }

        .lang-pill.active {
            background: #38bdf8;
            color: #020617;
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }

    </style>
</head>
<body>

    <div class="bottom-section">
        
        <div class="setting-row">
            <div class="setting-label">
                <!-- Isolamos o texto em um span com a tag data-i18n -->
                <i data-feather="globe" style="width: 18px;"></i> 
                <span data-i18n="lang_label">Idioma</span>
            </div>
            <div class="lang-selector">
                <div class="lang-pill" data-lang="PT" onclick="changeLang(this)">PT</div>
                <div class="lang-pill" data-lang="EN" onclick="changeLang(this)">EN</div>
                <div class="lang-pill" data-lang="ES" onclick="changeLang(this)">ES</div>
            </div>
        </div>

    </div>

    <script>
        feather.replace();

        // ==========================================
        // DICIONÁRIO DE TRADUÇÕES
        // ==========================================
        const translations = {
            PT: {
                lang_label: "Idioma"
            },
            EN: {
                lang_label: "Language"
            },
            ES: {
                lang_label: "Idioma" // Em espanhol também é "Idioma"
            }
        };

        // Função que aplica a tradução na página
        function applyTranslations(lang) {
            // Pega todos os elementos que têm o atributo data-i18n
            document.querySelectorAll('[data-i18n]').forEach(element => {
                // Pega a chave da tradução (ex: 'lang_label')
                const key = element.getAttribute('data-i18n');
                
                // Se a chave existir no nosso dicionário para o idioma escolhido, troca o texto
                if (translations[lang] && translations[lang][key]) {
                    element.innerText = translations[lang][key];
                }
            });
        }

        // ==========================================
        // LÓGICA DO IDIOMA COM LOCALSTORAGE
        // ==========================================

        function changeLang(element) {
            // Remove a classe active de todos
            document.querySelectorAll('.lang-pill').forEach(el => el.classList.remove('active'));
            // Adiciona no que foi clicado
            element.classList.add('active');

            // Pega o idioma selecionado e salva no localStorage do navegador
            const selectedLang = element.getAttribute('data-lang');
            localStorage.setItem('userLanguage', selectedLang);

            // Aplica a tradução imediatamente ao clicar
            applyTranslations(selectedLang);
        }

        function loadSavedLanguage() {
            // Verifica se tem idioma salvo. Se não tiver, usa 'PT' como padrão.
            const savedLang = localStorage.getItem('userLanguage') || 'PT';
            
            // Procura o botão (pill) correspondente ao idioma salvo
            const targetPill = document.querySelector(`.lang-pill[data-lang="${savedLang}"]`);
            
            if (targetPill) {
                // Ativa o botão correto visualmente
                document.querySelectorAll('.lang-pill').forEach(el => el.classList.remove('active'));
                targetPill.classList.add('active');
            }

            // Aplica a tradução salva ao carregar a página
            applyTranslations(savedLang);
        }

        // Executa a função de carregar assim que a página é carregada
        document.addEventListener('DOMContentLoaded', loadSavedLanguage);

    </script>
</body>
</html>
