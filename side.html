<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar - Configurações</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            color: #f8fafc;
            margin: 0;
            padding: 20px; /* Dá um respiro das bordas do iframe */
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* Mantém tudo lá no fundão */
            height: calc(100vh - 40px); /* 100vh menos o padding */
            overflow: hidden;
            box-sizing: border-box;
        }

        /* ==========================================
           BLOCO PRINCIPAL (CONTA + IDIOMA + CONFIGS)
           ========================================== */
        .bottom-section {
            background: rgba(15, 23, 42, 0.7); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
            margin: 4px 0;
        }

        /* Estilo base de botões da sidebar */
        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            box-sizing: border-box;
            text-align: left;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }

        .menu-item svg {
            width: 18px;
            height: 18px;
            transition: transform 0.3s;
        }

        /* ==========================================
           ÁREA DE CONTA (LOGIN / PERFIL)
           ========================================== */
        
        /* Botão de Entrar (Design aprimorado) */
        .login-btn {
            background: #38bdf8;
            color: #020617;
            font-weight: 600;
            justify-content: center; /* Agora centraliza direitinho */
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }
        .login-btn:hover {
            background: #7dd3fc;
            color: #020617;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        /* Perfil logado */
        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            font-size: 1.1rem;
            position: relative;
        }

        /* Bolinha de status */
        .user-avatar::after {
            content: '';
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 12px;
            height: 12px;
            background: #10b981;
            border: 2px solid #0f172a;
            border-radius: 50%;
        }

        .user-info-text {
            display: flex;
            flex-direction: column;
        }
        .user-name { color: #f8fafc; font-weight: 600; font-size: 0.95rem; }
        .user-status { color: #10b981; font-size: 0.75rem; font-weight: 500; }

        /* Botão Sair */
        .logout-btn {
            color: #ef4444;
            margin-top: 5px;
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
        }

        /* ==========================================
           MENU DE IDIOMA E DROPDOWN
           ========================================== */
        
        .dropdown-toggle {
            justify-content: space-between;
        }
        .dropdown-toggle-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .arrow-icon { transition: transform 0.3s ease; }
        .dropdown-toggle.open .arrow-icon { transform: rotate(180deg); }

        /* A lista de idiomas que abre */
        .dropdown-menu {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: all 0.3s ease-in-out;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .dropdown-menu.open {
            max-height: 200px;
            opacity: 1;
            padding: 8px;
            margin-top: 5px;
        }

        .lang-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .lang-option:hover {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }

        /* O idioma que está selecionado agora */
        .lang-option.active {
            color: #38bdf8;
            font-weight: 600;
            background: rgba(56, 189, 248, 0.05);
        }

    </style>
</head>
<body>

    <div class="bottom-section">
        
        <div id="auth-container"></div>

        <div class="divider"></div>

        <div>
            <button class="menu-item dropdown-toggle" id="lang-btn">
                <div class="dropdown-toggle-content">
                    <i data-feather="globe"></i> Idioma
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span id="current-lang-text" style="font-size: 0.8rem; color: #64748b;">PT-BR</span>
                    <i data-feather="chevron-down" class="arrow-icon"></i>
                </div>
            </button>

            <div class="dropdown-menu" id="lang-menu">
                <a href="#" class="lang-option active" onclick="selectLang(this, 'PT-BR')">
                    Português (BR)
                    <i data-feather="check" style="width: 16px; color: #38bdf8;"></i>
                </a>
                <a href="#" class="lang-option" onclick="selectLang(this, 'EN-US')">
                    English (US)
                    <i data-feather="check" style="width: 16px; opacity: 0;"></i>
                </a>
                <a href="#" class="lang-option" onclick="selectLang(this, 'ES-ES')">
                    Español (ES)
                    <i data-feather="check" style="width: 16px; opacity: 0;"></i>
                </a>
            </div>
        </div>

        <button class="menu-item">
            <i data-feather="settings"></i> Ajustes Gerais
        </button>

    </div>

    <script>
        // Inicializa ícones
        feather.replace();

        // ==========================================
        // LÓGICA DE LOGIN
        // ==========================================
        let isLogged = false; 
        const authContainer = document.getElementById('auth-container');

        function renderAuthStatus() {
            if (isLogged) {
                // Logado
                authContainer.innerHTML = `
                    <div class="user-profile">
                        <div class="user-avatar">S</div>
                        <div class="user-info-text">
                            <span class="user-name">Sodhupn Admin</span>
                            <span class="user-status">Online</span>
                        </div>
                    </div>
                    <button class="menu-item logout-btn" onclick="toggleLogin()">
                        <i data-feather="log-out"></i> Sair da Conta
                    </button>
                `;
            } else {
                // Deslogado (Botão Centralizado)
                authContainer.innerHTML = `
                    <button class="menu-item login-btn" onclick="toggleLogin()">
                        <i data-feather="log-in"></i> Fazer Login
                    </button>
                `;
            }
            feather.replace();
        }

        function toggleLogin() {
            isLogged = !isLogged;
            renderAuthStatus();
        }

        renderAuthStatus(); // Roda ao abrir a tela

        // ==========================================
        // LÓGICA DO MENU DE IDIOMAS
        // ==========================================
        const langBtn = document.getElementById('lang-btn');
        const langMenu = document.getElementById('lang-menu');
        const currentLangText = document.getElementById('current-lang-text');

        // Abre/fecha a lista de idiomas
        langBtn.addEventListener('click', () => {
            langBtn.classList.toggle('open');
            langMenu.classList.toggle('open');
        });

        // Função para selecionar um idioma
        function selectLang(element, langCode) {
            // 1. Tira a classe 'active' de todos
            document.querySelectorAll('.lang-option').forEach(el => {
                el.classList.remove('active');
                // Esconde o ícone de 'check' dos outros
                el.querySelector('svg').style.opacity = '0';
            });

            // 2. Adiciona 'active' no que foi clicado
            element.classList.add('active');
            
            // Mostra o ícone de 'check' e pinta ele de azul
            const checkIcon = element.querySelector('svg');
            checkIcon.style.opacity = '1';
            checkIcon.style.color = '#38bdf8';

            // 3. Atualiza o textinho do lado da seta
            currentLangText.textContent = langCode;

            // 4. Fecha o menu depois de escolher
            setTimeout(() => {
                langBtn.classList.remove('open');
                langMenu.classList.remove('open');
            }, 200); // pequeno delay pra pessoa ver que clicou
        }
    </script>
</body>
</html>
