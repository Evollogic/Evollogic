<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar - Navegação e Configurações</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Mudado para separar o topo da base */
            height: calc(100vh - 40px);
            overflow: hidden;
            box-sizing: border-box;
        }

        /* ==========================================
           MENU DE NAVEGAÇÃO (TOPO)
           ========================================== */
        .top-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nav-link {
            display: none; /* Escondido por padrão, o JS decide se mostra */
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            border-radius: 12px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-link:hover {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border-color: rgba(56, 189, 248, 0.2);
        }

        .nav-link i {
            width: 20px;
        }


        /* ==========================================
           CONFIGURAÇÕES (BASE)
           ========================================== */
        .bottom-section {
            background: rgba(15, 23, 42, 0.8); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 25px rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0;
        }

        .setting-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #94a3b8;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .lang-selector {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 4px;
        }

        .lang-pill {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: 0.3s;
        }

        .lang-pill.active {
            background: #38bdf8;
            color: #020617;
            box-shadow: 0 2px 10px rgba(56, 189, 248, 0.3);
        }

    </style>
</head>
<body>

    <!-- NAVEGAÇÃO DO USUÁRIO LOGADO -->
    <div class="top-section">
        <!-- Link de Perfil (Oculto por padrão) -->
        <a href="profile.html" class="nav-link" id="profileLink" target="_parent">
            <i data-feather="user"></i>
            <span data-i18n="nav_profile">Meu Perfil</span>
        </a>
    </div>

    <!-- CONFIGURAÇÕES DE IDIOMA -->
    <div class="bottom-section">
        <div class="setting-row">
            <div class="setting-label">
                <i data-feather="globe" style="width: 18px;"></i> 
                <span data-i18n="lang_label">Idioma</span>
            </div>
            <div class="lang-selector">
                <div class="lang-pill" data-lang="PT" onclick="changeLang(this)">PT</div>
                <div class="lang-pill" data-lang="EN" onclick="changeLang(this)">EN</div>
                <div class="lang-pill" data-lang="ES" onclick="changeLang(this)">ES</div>
            </div>
        </div>
    </div>

    <script>
        // Inicializa os ícones do Feather
        feather.replace();

        // ==========================================
        // VERIFICAÇÃO DE LOGIN (MOSTRAR ABA PERFIL)
        // ==========================================
        function checkLoginStatus() {
            // Busca o token gerado no login da Evollogic
            const userToken = localStorage.getItem('evollogic_auth_token');
            const profileLink = document.getElementById('profileLink');

            // Se o token existir, altera o CSS para mostrar o botão
            if (userToken) {
                profileLink.style.display = 'flex';
            }
        }

        // ==========================================
        // DICIONÁRIO DE TRADUÇÕES
        // ==========================================
        const translations = {
            PT: {
                lang_label: "Idioma",
                nav_profile: "Meu Perfil"
            },
            EN: {
                lang_label: "Language",
                nav_profile: "My Profile"
            },
            ES: {
                lang_label: "Idioma", 
                nav_profile: "Mi Perfil"
            }
        };

        // Função que aplica a tradução na página
        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.innerText = translations[lang][key];
                }
            });
        }

        // ==========================================
        // LÓGICA DO IDIOMA COM LOCALSTORAGE
        // ==========================================
        function changeLang(element) {
            document.querySelectorAll('.lang-pill').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            const selectedLang = element.getAttribute('data-lang');
            localStorage.setItem('userLanguage', selectedLang);

            applyTranslations(selectedLang);
        }

        function loadSavedLanguage() {
            const savedLang = localStorage.getItem('userLanguage') || 'PT';
            const targetPill = document.querySelector(`.lang-pill[data-lang="${savedLang}"]`);
            
            if (targetPill) {
                document.querySelectorAll('.lang-pill').forEach(el => el.classList.remove('active'));
                targetPill.classList.add('active');
            }

            applyTranslations(savedLang);
        }

        // Executa a verificação de login e de idioma quando a página carregar
        document.addEventListener('DOMContentLoaded', () => {
            loadSavedLanguage();
            checkLoginStatus(); 
        });

    </script>
</body>
</html>
