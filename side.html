<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar - Configurações</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            height: calc(100vh - 40px);
            overflow: hidden;
            box-sizing: border-box;
        }

        .bottom-section {
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .bottom-section:hover {
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .profile-btn {
            display: none; 
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            padding: 12px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(56, 189, 248, 0.2);
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .profile-btn:hover {
            background: #38bdf8;
            color: #020617;
            border-color: #38bdf8;
            box-shadow: 0 8px 25px rgba(56, 189, 248, 0.4);
            transform: translateY(-2px);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
            width: 100%;
            display: none; 
            border-radius: 1px;
            margin: 4px 0;
        }

        .setting-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .setting-label {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #cbd5e1;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .lang-selector {
            display: flex;
            background: rgba(15, 23, 42, 0.6);
            border-radius: 10px;
            padding: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
        }

        .lang-pill {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .lang-pill:hover:not(.active) {
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.05);
        }

        .lang-pill.active {
            background: rgba(56, 189, 248, 0.2);
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        .version-info {
            text-align: center;
            font-size: 0.75rem;
            color: #475569;
            margin-top: 8px;
            font-weight: 500;
            letter-spacing: 0.5px;
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="bottom-section">
        
        <a href="profile.html" class="profile-btn hover-sfx click-sfx" id="btnProfile" target="_parent">
            <i data-feather="user" style="width: 18px;"></i>
            <span data-i18n="nav_profile">Meu Perfil</span>
        </a>

        <div class="divider" id="menuDivider"></div>
        
        <div class="setting-row">
            <div class="setting-label">
                <i data-feather="globe" style="width: 18px;"></i> 
                <span data-i18n="lang_label">Idioma</span>
            </div>
            <div class="lang-selector">
                <div class="lang-pill hover-sfx click-sfx" data-lang="PT" onclick="changeLang(this)">PT</div>
                <div class="lang-pill hover-sfx click-sfx" data-lang="EN" onclick="changeLang(this)">EN</div>
                <div class="lang-pill hover-sfx click-sfx" data-lang="ES" onclick="changeLang(this)">ES</div>
            </div>
        </div>

        <div class="version-info">
            Evollogic Hub <span data-i18n="version_text">Versão</span> 1.0.0
        </div>

    </div>

    <script>
        feather.replace();

        // Sistema de Efeitos Sonoros (SFX)
        const sfx = {
            hover: new Audio('https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3'),
            click: new Audio('https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3')
        };
        sfx.hover.volume = 0.15;
        sfx.click.volume = 0.3;

        function playSound(type) {
            let sound = sfx[type].cloneNode(); 
            sound.volume = sfx[type].volume;
            sound.play().catch(() => {}); 
        }

        document.querySelectorAll('.hover-sfx').forEach(el => {
            el.addEventListener('mouseenter', () => playSound('hover'));
        });
        document.querySelectorAll('.click-sfx').forEach(el => {
            el.addEventListener('click', () => playSound('click'));
        });

        // Lógica de Login
        function checkLoginStatus() {
            const isLogged = localStorage.getItem('evollogic_auth_token');
            if (isLogged) {
                document.getElementById('btnProfile').style.display = 'flex';
                document.getElementById('menuDivider').style.display = 'block';
            }
        }

        // Sistema de Idiomas
        const translations = {
            PT: { lang_label: "Idioma", nav_profile: "Meu Perfil", version_text: "Versão" },
            EN: { lang_label: "Language", nav_profile: "My Profile", version_text: "Version" },
            ES: { lang_label: "Idioma", nav_profile: "Mi Perfil", version_text: "Versión" }
        };

        function applyTranslations(lang) {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.innerText = translations[lang][key];
                }
            });
        }

        function changeLang(element) {
            document.querySelectorAll('.lang-pill').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            const selectedLang = element.getAttribute('data-lang');
            localStorage.setItem('userLanguage', selectedLang);

            applyTranslations(selectedLang);
            
            // Dispara um evento global para que a página "pai" (o Hub) atualize instantaneamente
            window.parent.dispatchEvent(new StorageEvent('storage', {
                key: 'userLanguage',
                newValue: selectedLang
            }));
        }

        function loadSavedLanguage() {
            const savedLang = localStorage.getItem('userLanguage') || 'PT';
            const targetPill = document.querySelector(`.lang-pill[data-lang="${savedLang}"]`);
            
            if (targetPill) {
                document.querySelectorAll('.lang-pill').forEach(el => el.classList.remove('active'));
                targetPill.classList.add('active');
            }

            applyTranslations(savedLang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadSavedLanguage();
            checkLoginStatus();
        });
    </script>
</body>
</html>
