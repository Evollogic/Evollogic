<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evollogic - Criar Conta</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>

    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        /* Efeito de brilho de fundo */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.12) 0%, rgba(0,0,0,0) 70%);
            top: -50px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
        }

        .register-container {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            z-index: 10;
            margin: auto;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            box-sizing: border-box;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .register-header img {
            width: 70px;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        .register-header h1 {
            font-size: 1.8rem;
            margin: 0 0 5px 0;
            font-weight: 700;
            color: #f8fafc;
        }

        .register-header p {
            color: #94a3b8;
            font-size: 0.95rem;
            margin: 0;
        }

        /* Alertas de Erro/Sucesso */
        .alert-box {
            display: none;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            animation: slideUp 0.3s ease;
        }

        /* Botões Sociais */
        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .social-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            border: 1px solid transparent;
        }

        .btn-discord { background: rgba(88, 101, 242, 0.1); color: #fff; border-color: rgba(88, 101, 242, 0.3); }
        .btn-discord:hover { background: #5865F2; box-shadow: 0 4px 15px rgba(88, 101, 242, 0.4); transform: translateY(-2px); }

        .btn-google { background: rgba(255, 255, 255, 0.05); color: #fff; border-color: rgba(255, 255, 255, 0.1); }
        .btn-google:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }

        .social-icon { width: 18px; height: 18px; }

        /* Divisor */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
            margin-bottom: 25px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .divider:not(:empty)::before { margin-right: 15px; }
        .divider:not(:empty)::after { margin-left: 15px; }

        /* Formulário */
        .form-row {
            display: flex;
            gap: 15px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
            position: relative;
            flex: 1;
        }

        .input-group label {
            display: block;
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .input-wrapper i,
        .input-wrapper svg {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            width: 20px;
            height: 20px;
            z-index: 2;
        }

        .input-field {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f8fafc;
            padding: 14px 14px 14px 50px;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
        }

        .input-field:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
        }

        .input-field:focus + i,
        .input-field:focus ~ svg {
            color: #38bdf8;
            transition: 0.3s;
        }

        /* Checkbox Termos */
        .terms-group {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .terms-group input[type="checkbox"] {
            margin-top: 3px;
            accent-color: #38bdf8;
            cursor: pointer;
        }

        .terms-group a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 500;
        }
        .terms-group a:hover { text-decoration: underline; }

        /* Botão Principal */
        .submit-btn {
            width: 100%;
            background: #38bdf8;
            color: #020617;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.2);
        }

        .submit-btn:hover {
            background: #7dd3fc;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4);
        }

        /* Login Link */
        .login-area {
            text-align: center;
            margin-top: 25px;
            font-size: 0.95rem;
            color: #94a3b8;
        }

        .login-area a {
            color: #38bdf8;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .login-area a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }

        /* Responsividade para telas menores */
        @media (max-width: 480px) {
            .form-row { flex-direction: column; gap: 0; }
        }

    </style>
</head>
<body>

    <div class="register-container">
        
        <div class="register-header">
            <img src="https://i.imgur.com/31WnC6D.png" alt="Evollogic Logo">
            <h1 data-i18n="h1_create">Criar uma Conta</h1>
            <p data-i18n="p_join">Junte-se ao ecossistema Evollogic</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <div class="social-login">
            <button class="social-btn btn-discord" type="button" onclick="registerWith('Discord')">
                <img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png" alt="Discord" class="social-icon">
                Discord
            </button>
            <button class="social-btn btn-google" type="button" onclick="registerWith('Google')">
                <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" alt="Google" class="social-icon">
                Google
            </button>
        </div>

        <div class="divider" data-i18n="divider_reg">ou registre-se com e-mail</div>

        <form id="registerForm">
            
            <div class="input-group">
                <label for="username" data-i18n="label_username">Nome de Usuário</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="input-field" data-i18n-placeholder="placeholder_username" placeholder="Seu nome ou apelido" required>
                    <i data-feather="user"></i>
                </div>
            </div>

            <div class="input-group">
                <label for="email" data-i18n="label_email">E-mail</label>
                <div class="input-wrapper">
                    <input type="email" id="email" class="input-field" data-i18n-placeholder="placeholder_email" placeholder="contato@evollogic.com" required>
                    <i data-feather="mail"></i>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label for="password" data-i18n="label_pass">Senha</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="input-field" placeholder="••••••••" required>
                        <i data-feather="lock"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirm-password" data-i18n="label_confirm">Confirmar</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirm-password" class="input-field" placeholder="••••••••" required>
                        <i data-feather="check-circle"></i>
                    </div>
                </div>
            </div>

            <div class="terms-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">
                    <span data-i18n="terms_1">Eu concordo com os</span> 
                    <a href="#" data-i18n="terms_2">Termos de Serviço</a> 
                    <span data-i18n="terms_3">e a</span> 
                    <a href="#" data-i18n="terms_4">Política de Privacidade</a>.
                </label>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn" data-i18n="btn_register">Criar Conta Agora</button>

        </form>

        <div class="login-area">
            <span data-i18n="already_have">Já tem uma conta?</span> 
            <a href="login.html" data-i18n="do_login">Faça Login</a>
        </div>

    </div>

    <script>
        feather.replace();

        // Traduções
        const translations = {
            PT: {
                page_title: "Evollogic - Criar Conta",
                h1_create: "Criar uma Conta",
                p_join: "Junte-se ao ecossistema Evollogic",
                divider_reg: "ou registre-se com e-mail",
                label_username: "Nome de Usuário",
                placeholder_username: "Seu nome ou apelido",
                label_email: "E-mail",
                placeholder_email: "contato@evollogic.com",
                label_pass: "Senha",
                label_confirm: "Confirmar Senha",
                terms_1: "Eu concordo com os",
                terms_2: "Termos de Serviço",
                terms_3: "e a",
                terms_4: "Política de Privacidade",
                btn_register: "Criar Conta Agora",
                already_have: "Já tem uma conta?",
                do_login: "Faça Login",
                auth_alert: "Iniciando registro via",
                // Erros de Validação
                err_pass_match: "As senhas não coincidem.",
                err_pass_length: "A senha deve ter pelo menos 8 caracteres.",
                err_pass_special: "A senha deve conter pelo menos 1 caractere especial (@$!%*?&).",
                err_pass_contains_name: "A senha não pode conter seu nome de usuário.",
                err_pass_contains_email: "A senha não pode conter o seu e-mail.",
                registering: "Criando conta...",
                reg_success: "Conta criada com sucesso! Redirecionando para o login..."
            },
            EN: {
                page_title: "Evollogic - Create Account",
                h1_create: "Create an Account",
                p_join: "Join the Evollogic ecosystem",
                divider_reg: "or register with email",
                label_username: "Username",
                placeholder_username: "Your name or nickname",
                label_email: "Email",
                placeholder_email: "contact@evollogic.com",
                label_pass: "Password",
                label_confirm: "Confirm Password",
                terms_1: "I agree to the",
                terms_2: "Terms of Service",
                terms_3: "and",
                terms_4: "Privacy Policy",
                btn_register: "Create Account Now",
                already_have: "Already have an account?",
                do_login: "Sign In",
                auth_alert: "Starting registration via",
                // Erros de Validação
                err_pass_match: "Passwords do not match.",
                err_pass_length: "Password must be at least 8 characters long.",
                err_pass_special: "Password must contain at least 1 special character (@$!%*?&).",
                err_pass_contains_name: "Password cannot contain your username.",
                err_pass_contains_email: "Password cannot contain your email.",
                registering: "Creating account...",
                reg_success: "Account created successfully! Redirecting to login..."
            },
            ES: {
                page_title: "Evollogic - Crear Cuenta",
                h1_create: "Crear una Cuenta",
                p_join: "Únete al ecosistema Evollogic",
                divider_reg: "o regístrate con correo",
                label_username: "Nombre de Usuario",
                placeholder_username: "Tu nombre o apodo",
                label_email: "Correo electrónico",
                placeholder_email: "contacto@evollogic.com",
                label_pass: "Contraseña",
                label_confirm: "Confirmar Contraseña",
                terms_1: "Acepto los",
                terms_2: "Términos de Servicio",
                terms_3: "y la",
                terms_4: "Política de Privacidad",
                btn_register: "Crear Cuenta Ahora",
                already_have: "¿Ya tienes una cuenta?",
                do_login: "Iniciar Sesión",
                auth_alert: "Iniciando registro vía",
                // Erros de Validação
                err_pass_match: "Las contraseñas no coinciden.",
                err_pass_length: "La contraseña debe tener al menos 8 caracteres.",
                err_pass_special: "La contraseña debe contener al menos 1 carácter especial (@$!%*?&).",
                err_pass_contains_name: "La contraseña no puede contener tu nombre de usuario.",
                err_pass_contains_email: "La contraseña no puede contener tu correo.",
                registering: "Creando cuenta...",
                reg_success: "¡Cuenta creada con éxito! Redirigiendo al inicio de sesión..."
            }
        };

        let currentLang = localStorage.getItem('userLanguage');

        if (!currentLang) {
            const browserLang = (navigator.language || navigator.userLanguage).substring(0, 2).toUpperCase();
            currentLang = ['PT', 'EN', 'ES'].includes(browserLang) ? browserLang : 'EN';
            localStorage.setItem('userLanguage', currentLang);
        }

        function applyTranslations(lang) {
            document.title = translations[lang].page_title;
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.innerHTML = translations[lang][key];
                }
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
                const key = element.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    element.placeholder = translations[lang][key];
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            applyTranslations(currentLang);
            window.addEventListener('storage', (e) => {
                if (e.key === 'userLanguage') {
                    currentLang = e.newValue || 'EN';
                    applyTranslations(currentLang);
                }
            });
        });

        function showAlert(messageKey, isError = true) {
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'block';
            alertBox.innerHTML = translations[currentLang][messageKey] || messageKey;
            
            if (isError) {
                alertBox.style.backgroundColor = 'rgba(239, 68, 68, 0.15)';
                alertBox.style.color = '#f87171';
                alertBox.style.border = '1px solid rgba(239, 68, 68, 0.3)';
            } else {
                alertBox.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
                alertBox.style.color = '#34d399';
                alertBox.style.border = '1px solid rgba(16, 185, 129, 0.3)';
            }
        }

        // ==========================================
        // LÓGICA DE VALIDAÇÃO DE SENHA RIGOROSA
        // ==========================================
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim().toLowerCase();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            // 1. Verifica se as senhas coincidem
            if(password !== confirmPassword) {
                return showAlert('err_pass_match', true);
            }

            // 2. Verifica tamanho (Min 8 caracteres)
            if(password.length < 8) {
                return showAlert('err_pass_length', true);
            }

            // 3. Verifica se tem caractere especial (Regex)
            const specialCharRegex = /[@$!%*?&]/;
            if(!specialCharRegex.test(password)) {
                return showAlert('err_pass_special', true);
            }

            // 4. Verifica se contém o Username (se o username tiver mais de 3 letras pra evitar falsos positivos)
            if(username.length > 3 && password.toLowerCase().includes(username)) {
                return showAlert('err_pass_contains_name', true);
            }

            // 5. Verifica se contém o Email (parte antes do @)
            const emailPrefix = email.split('@')[0];
            if(emailPrefix.length > 3 && password.toLowerCase().includes(emailPrefix)) {
                return showAlert('err_pass_contains_email', true);
            }

            // Se passou em tudo, prossegue!
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');
            
            alertBox.style.display = 'none';
            btn.innerHTML = translations[currentLang].registering;
            btn.style.opacity = '0.8';
            btn.style.pointerEvents = 'none';

            // ATENÇÃO: Aqui você conectará com a sua API de Registro (/api/register) futuramente.
            // Por enquanto, apenas simula o sucesso.
            setTimeout(() => {
                showAlert('reg_success', false);
                setTimeout(() => {
                    window.location.href = 'login.html'; 
                }, 1500);
            }, 1000);
        });

        // ==========================================
        // REDIRECIONAMENTO PRO BACKEND (OAUTH)
        // ==========================================
        function registerWith(provider) {
            const btnDiscord = document.querySelector('.btn-discord');
            const btnGoogle = document.querySelector('.btn-google');
            const baseUrl = 'https://evollogic-backend-production.up.railway.app';

            if (provider === 'Discord') {
                btnDiscord.innerHTML = translations[currentLang].registering || "Autenticando...";
                window.location.href = `${baseUrl}/api/auth/discord`;
            } else if (provider === 'Google') {
                btnGoogle.innerHTML = translations[currentLang].registering || "Autenticando...";
                window.location.href = `${baseUrl}/api/auth/google`;
            }
        }
    </script>
</body>
</html>
