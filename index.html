<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evollogic - System Gateway</title>
    
    <link rel="stylesheet" href="style.css?v=2.0">
    <link href="https://fonts.googleapis.com/css2?family=Rubik+Glitch&display=swap" rel="stylesheet">

    <style>
        /* Estilos adicionais para o contador e botões */
        #countdown-container {
            margin: 30px 0;
            text-align: center;
        }

        /* Efeito Sinistro e Corrompido nos Números */
        #countdown-display {
            font-size: clamp(3rem, 8vw, 5rem);
            color: #cc0000; /* Vermelho sangue escuro */
            text-shadow: 
                0 0 10px rgba(255, 0, 0, 0.8),
                3px 3px 0px rgba(0, 255, 136, 0.2), /* Sombras tipo erro de VHS */
                -3px -3px 0px rgba(0, 0, 255, 0.3);
            font-family: 'Rubik Glitch', 'Courier New', monospace;
            font-weight: normal;
            letter-spacing: 5px;
            animation: creepy-flicker 0.2s infinite; /* Animação rápida de falha */
        }

        /* Animação macabra de cintilação e distorção */
        @keyframes creepy-flicker {
            0% { opacity: 0.9; transform: skewX(0deg); text-shadow: 0 0 10px #ff0000; }
            25% { opacity: 0.6; text-shadow: 0 0 20px #ff0000, 4px 0 0 #00ff88; }
            50% { opacity: 1; transform: skewX(-3deg); }
            75% { opacity: 0.4; transform: skewX(3deg); text-shadow: -4px 0 0 #00ff88; }
            100% { opacity: 0.9; transform: skewX(0deg); text-shadow: 0 0 10px #8a0000; }
        }

        .hub-btn {
            background: #00ff88;
            color: #020617;
            border: 2px solid #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            text-transform: uppercase;
            border-radius: 8px;
            transition: 0.3s;
            animation: fadeIn 1s ease;
        }

        .hub-btn:hover {
            background: transparent;
            color: #00ff88;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.8);
        }
    </style>
</head>
<body class="crt">

    <div id="stars"></div>

    <div id="init-screen">
        <button id="btn-start-boot" class="cyber-btn init-btn">[ INICIAR_SISTEMA ]</button>
    </div>

    <div id="terminal-boot" style="display: none;">
        <div id="terminal-text"></div>
        <span class="cursor">_</span>
    </div>

    <div id="coming-soon-screen" style="display: none;">
        
        <div id="transmission-prompt">
            <h2 style="color: #00ff88; letter-spacing: 3px; font-size: clamp(1.2rem, 4vw, 2rem);">> INCOMING TRANSMISSION...</h2>
            <button id="btn-accept-transmission" class="cyber-btn">ACCEPT</button>
        </div>

        <div id="coming-soon-content" style="display: none; text-align: center;">
            <img src="https://i.imgur.com/31WnC6D.png" alt="Evollogic" class="main-logo" style="width: 120px; margin-bottom: 20px;">
            <h1 class="title-text" style="color: #f8fafc; font-family: monospace;">BUILDER WORLDS</h1>
            
            <div class="message-card">
                <p style="font-size: 1.1rem; line-height: 1.6; color: #94a3b8; margin-bottom: 20px;">
                    Os portais estão selados.<br>
                    Aguarde a liberação do sistema central.
                </p>
                
                <div id="countdown-container">
                    <div id="countdown-display">CARREGANDO...</div>
                </div>
            </div>
            
            <button id="btn-toggle-music" class="cyber-btn-small" style="margin-top: 30px;">🔊 MUTE AUDIO</button>
        </div>

        <audio id="bg-music" loop style="display: none;">
            <source src="Menu Suspenso.mp3" type="audio/mpeg">
        </audio>

        <audio id="macabre-tick" style="display: none;">
            <source src="https://actions.google.com/sounds/v1/alarms/mechanical_clock_tick.ogg" type="audio/ogg">
        </audio>
        
        <audio id="heartbeat-sound" style="display: none;">
            <source src="https://actions.google.com/sounds/v1/human_voices/heartbeat.ogg" type="audio/ogg">
        </audio>

    </div>

    <script>
        // ==========================================
        // DATA DO EVENTO (Sábado, 16 de Maio de 2026 às 17:00:00)
        // ==========================================
        const targetDate = new Date("May 16, 2026 17:00:00").getTime();
        
        let countdownInterval;

        // Elementos de Áudio
        const bgMusic = document.getElementById('bg-music');
        const tickSound = document.getElementById('macabre-tick');
        const heartbeatSound = document.getElementById('heartbeat-sound');
        
        tickSound.volume = 0.9; // Tique mecânico alto
        heartbeatSound.volume = 1.0; // Batimento cardíaco no máximo para tensão

        // ==========================================
        // SEQUÊNCIA DE INICIALIZAÇÃO
        // ==========================================
        document.getElementById('btn-start-boot').addEventListener('click', () => {
            document.getElementById('init-screen').style.display = 'none';
            document.getElementById('terminal-boot').style.display = 'block';
            
            const termText = document.getElementById('terminal-text');
            termText.innerHTML = "> Conectando aos servidores Evollogic...<br>> Bypass de segurança concluído...<br>> Estabelecendo conexão...";
            
            // Simula o tempo de carregamento
            setTimeout(() => {
                document.getElementById('terminal-boot').style.display = 'none';
                document.getElementById('coming-soon-screen').style.display = 'flex';
                document.getElementById('coming-soon-screen').style.flexDirection = 'column';
                document.getElementById('coming-soon-screen').style.alignItems = 'center';
            }, 2500);
        });

        // ==========================================
        // ACEITAR TRANSMISSÃO E INICIAR CONTADOR
        // ==========================================
        document.getElementById('btn-accept-transmission').addEventListener('click', () => {
            document.getElementById('transmission-prompt').style.display = 'none';
            document.getElementById('coming-soon-content').style.display = 'block';
            
            // Toca a música de fundo
            bgMusic.play().catch(e => console.log("Áudio bloqueado pelo navegador"));
            
            // Inicia o Relógio do Apocalipse
            startCountdown();
        });

        // ==========================================
        // LÓGICA DO CONTADOR MISTERIOSO
        // ==========================================
        function startCountdown() {
            countdownInterval = setInterval(() => {
                const now = new Date().getTime();
                const distance = targetDate - now;

                // SE O TEMPO ZEROU
                if (distance <= 0) {
                    clearInterval(countdownInterval);
                    
                    // Mostra o botão para entrar no HUB
                    document.getElementById('countdown-container').innerHTML = `
                        <h2 style="color: #00ff88; margin-bottom: 20px;">ACESSO LIBERADO</h2>
                        <button class="hub-btn" onclick="window.location.href='login.html'">[ ENTRAR NO HUB ]</button>
                    `;
                    
                    // Para os sons macabros e deixa só a música
                    tickSound.pause();
                    heartbeatSound.pause();
                    return;
                }

                // Cálculos de tempo
                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                const fDays = days.toString().padStart(2, '0');
                const fHours = hours.toString().padStart(2, '0');
                const fMinutes = minutes.toString().padStart(2, '0');
                const fSeconds = seconds.toString().padStart(2, '0');

                // Atualiza a tela
                document.getElementById('countdown-display').innerHTML = 
                    `${fDays}:${fHours}:${fMinutes}:${fSeconds}`;

                // TOCA OS SONS MACABROS COMBINADOS A CADA SEGUNDO
                tickSound.currentTime = 0; 
                heartbeatSound.currentTime = 0;
                
                tickSound.play().catch(e => console.log("Som bloqueado"));
                heartbeatSound.play().catch(e => console.log("Som bloqueado"));

            }, 1000);
        }

        // ==========================================
        // BOTÃO DE MUTAR ÁUDIO
        // ==========================================
        document.getElementById('btn-toggle-music').addEventListener('click', function() {
            if (bgMusic.paused && tickSound.paused) {
                bgMusic.play();
                tickSound.muted = false;
                heartbeatSound.muted = false;
                this.innerText = '🔊 MUTE AUDIO';
            } else {
                bgMusic.pause();
                tickSound.muted = true; 
                heartbeatSound.muted = true;
                this.innerText = '🔇 UNMUTE AUDIO';
            }
        });
    </script>
</body>
</html>
