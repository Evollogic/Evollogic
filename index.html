<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evollogic - Restricted Access</title>
    <style>
        /* Evollogic Hacker/Dev Core Style */
        body { 
            background-color: #05051a; 
            color: #fff; 
            font-family: 'Courier New', monospace; 
            text-align: center; 
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Starfield Background Effect */
        #stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #0b0b2a 0%, #050510 100%);
            z-index: -1;
        }

        .login-box { 
            background: rgba(10, 10, 40, 0.9); 
            border: 1px solid #00d4ff; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 0 40px rgba(0, 212, 255, 0.2); 
            backdrop-filter: blur(10px);
            z-index: 10;
        }
        
        input { 
            padding: 12px; margin: 10px 0; width: 280px;
            border-radius: 5px; border: 1px solid #00d4ff; 
            background: #000; color: #00ff88; 
            font-weight: bold; outline: none; transition: 0.3s;
        }

        input:focus { box-shadow: 0 0 15px #00d4ff; }
        
        button { 
            padding: 12px 25px; background: #00d4ff; color: #000; 
            border: none; border-radius: 5px; cursor: pointer; 
            font-weight: bold; width: 100%; font-size: 1rem; 
            transition: 0.3s; margin-top: 15px;
            text-transform: uppercase; letter-spacing: 2px;
        }
        button:hover { 
            background: #00ff88; box-shadow: 0 0 25px #00ff88; 
            transform: scale(1.05); 
        }

        /* Music Toggle Button Specific Style */
        #btn-toggle-music {
            width: auto;
            background: rgba(0, 212, 255, 0.2);
            color: #00d4ff;
            border: 1px solid #00d4ff;
            padding: 8px 15px;
            font-size: 0.8rem;
            margin-top: 30px;
        }
        #btn-toggle-music:hover { background: #00d4ff; color: #000; }
        
        /* MAGIC LOGO ANIMATION */
        @keyframes logoFloat {
            0% { transform: translateY(0px); filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.4)); }
            50% { transform: translateY(-20px); filter: drop-shadow(0 0 30px rgba(0, 255, 136, 0.8)); }
            100% { transform: translateY(0px); filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.4)); }
        }

        .main-logo {
            width: 280px;
            animation: logoFloat 5s ease-in-out infinite;
            pointer-events: none;
            margin-bottom: 20px;
        }

        #coming-soon-screen { display: none; }
        #transmission-prompt { display: none; }
        #coming-soon-content { display: none; }
        #app-wrapper { display: none; }
        #loading-screen { color: #00d4ff; font-size: 1.5rem; letter-spacing: 5px; animation: blink 1s infinite; }

        @keyframes blink { 50% { opacity: 0; } }

        .message-card {
            max-width: 600px;
            padding: 20px;
            border-top: 1px solid rgba(0, 212, 255, 0.3);
            margin-top: 20px;
            margin-left: auto;
            margin-right: auto;
        }

        .glitch-text {
            color: #00ff88;
            text-shadow: 2px 2px #ff0055;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="stars"></div>

    <div id="loading-screen">
        <p>> INITIALIZING_ENCRYPTION...</p>
    </div>

    <div id="coming-soon-screen">
        
        <div id="transmission-prompt">
            <h2 style="color: #00d4ff; letter-spacing: 3px;">> INCOMING TRANSMISSION...</h2>
            <button id="btn-accept-transmission" style="width: auto; padding: 15px 40px; margin-top: 20px; font-size: 1.2rem;">ACCEPT</button>
        </div>

        <div id="coming-soon-content">
            <img src="https://i.imgur.com/31WnC6D.png" alt="Evollogic" class="main-logo">
            <h1 style="letter-spacing: 5px; font-size: 2.5rem;">BUILDER WORLDS</h1>
            <div class="message-card">
                <p style="font-size: 1.2rem; line-height: 1.6; color: #a0a0d0;">
                    The portals are currently under maintenance. <br>
                    Exclusive access for the creation team only.
                </p>
                <p class="glitch-text">COMING THIS MONTH</p>
            </div>
            <button id="btn-toggle-music">🔊 MUTE AUDIO</button>
        </div>

        <audio id="bg-music" loop>
            <source src="Menu Suspenso.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>

    </div>

    <div id="app-wrapper">
        <div id="login-screen" class="login-box">
            <img src="https://i.imgur.com/31WnC6D.png" alt="Evollogic" style="width: 180px; margin-bottom: 10px;">
            <h2 style="color: #00d4ff; margin-bottom: 20px;">ADMIN_PANEL</h2>
            
            <input type="email" id="email" placeholder="DECRYPT_EMAIL"><br>
            <input type="password" id="password" placeholder="SECURITY_KEY"><br>
            <button id="btn-login">ACCESS SYSTEM</button>
            
            <p id="error-message" style="color: #ff0055; display: none; margin-top: 15px; font-weight: bold;">[!] ACCESS_DENIED</p>
        </div>

        <div id="secret-hub" style="display:none;">
            <h1 style="color: #00ff88;">SYSTEM ONLINE</h1>
            <p>Welcome back, Architect.</p>
            <button id="btn-logout" style="background: #ff0055; color: #fff; width: auto; padding: 10px 40px;">SHUTDOWN</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_ID",
            appId: "SEU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // --- AUDIO ENGINE (BEEPS) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playBeep(freq = 400, type = 'square', duration = 0.1) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        // --- BACKGROUND MUSIC LOGIC ---
        const bgMusic = document.getElementById('bg-music');
        const btnToggleMusic = document.getElementById('btn-toggle-music');
        
        document.getElementById('btn-accept-transmission').addEventListener('click', () => {
            playBeep(600, 'sine', 0.2); // Cool interaction sound
            document.getElementById('transmission-prompt').style.display = 'none';
            document.getElementById('coming-soon-content').style.display = 'block';
            
            // Start the background music
            bgMusic.volume = 0.5; // Starts at 50% volume
            bgMusic.play().catch(e => console.log("Audio play blocked by browser:", e));
        });

        btnToggleMusic.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play();
                btnToggleMusic.innerText = "🔊 MUTE AUDIO";
            } else {
                bgMusic.pause();
                btnToggleMusic.innerText = "🔇 UNMUTE AUDIO";
            }
        });

        // --- IP PROTECTION ---
        const ALLOWED_IP = "COLOQUE_SEU_IP_AQUI"; 

        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
                document.getElementById('loading-screen').style.display = 'none';
                if (data.ip === ALLOWED_IP) {
                    document.getElementById('app-wrapper').style.display = 'block';
                } else {
                    document.getElementById('coming-soon-screen').style.display = 'block';
                    document.getElementById('transmission-prompt').style.display = 'block';
                }
            })
            .catch(() => {
                // Failsafe in case the API goes down
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('coming-soon-screen').style.display = 'block';
                document.getElementById('transmission-prompt').style.display = 'block';
            });

        // --- FIREBASE LOGIC ---
        onAuthStateChanged(auth, (user) => {
            const loginScreen = document.getElementById('login-screen');
            const secretHub = document.getElementById('secret-hub');
            if (user) {
                loginScreen.style.display = 'none';
                secretHub.style.display = 'block';
            } else {
                loginScreen.style.display = 'block';
                secretHub.style.display = 'none';
            }
        });

        document.getElementById('btn-login').addEventListener('click', () => {
            playBeep(800, 'sine');
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            
            signInWithEmailAndPassword(auth, email, pass)
                .catch(() => {
                    playBeep(100, 'sawtooth', 0.5);
                    document.getElementById('error-message').style.display = 'block';
                });
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            playBeep(300, 'square');
            signOut(auth);
        });
    </script>
</body>
</html>
