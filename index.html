<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVOLLOGIC_OS // TERMINAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="crt"> <div id="stars"></div>

    <div id="terminal-boot">
        <div id="terminal-text"></div>
        <span class="cursor">_</span>
    </div>

    <div id="coming-soon-screen" style="display: none;">
        <div id="transmission-prompt">
            <h2 class="glitch" data-text="> INCOMING TRANSMISSION...">> INCOMING TRANSMISSION...</h2>
            <button id="btn-accept-transmission" class="cyber-button">ACCEPT</button>
        </div>

        <div id="coming-soon-content" style="display: none;">
            <img src="https://i.imgur.com/31WnC6D.png" alt="Evollogic" class="main-logo">
            <h1 style="letter-spacing: 5px; font-size: 2.5rem; text-shadow: 0 0 10px #00d4ff;">BUILDER WORLDS</h1>
            <div class="message-card">
                <p style="font-size: 1.2rem; line-height: 1.6; color: #a0a0d0;">
                    SYSTEM_LOCKED. <br>
                    Exclusive access for the engineering team.
                </p>
                <p class="neon-text">COMING THIS MONTH</p>
            </div>
            <button id="btn-toggle-music" class="cyber-button-small">🔊 MUTE AUDIO</button>
        </div>

        <audio id="bg-music" loop>
            <source src="Menu Suspenso.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div id="app-wrapper" style="display: none;">
        <div id="login-screen" class="login-box">
            <img src="https://i.imgur.com/31WnC6D.png" alt="Evollogic" style="width: 150px; margin-bottom: 10px;">
            <h2 class="glitch" data-text="ADMIN_PANEL" style="margin-bottom: 20px;">ADMIN_PANEL</h2>
            
            <input type="email" id="email" placeholder="[ ENTER_EMAIL ]" autocomplete="off"><br>
            <input type="password" id="password" placeholder="[ ENTER_KEY ]"><br>
            <button id="btn-login" class="cyber-button">INITIALIZE</button>
            
            <p id="error-message" class="error-text">[!] AUTH_FAILED</p>
        </div>

        <div id="secret-hub" style="display: none;">
            <h1 class="neon-text">MAIN_FRAME ACCESSED</h1>
            <p>Welcome back, Architect.</p>
            <button id="btn-logout" class="cyber-button alert-button">DISCONNECT</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
