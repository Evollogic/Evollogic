<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evollogic - Restricted Access</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="crt">

    <div id="stars"></div>

    <div id="init-screen">
        <button id="btn-start-boot" class="cyber-btn init-btn">> INICIAR_SISTEMA <</button>
    </div>

    <div id="terminal-boot" style="display: none;">
        <div id="terminal-text"></div>
        <span class="cursor">_</span>
    </div>

    <div id="coming-soon-screen" style="display: none;">
        <div id="transmission-prompt">
            <h2 style="color: #00ff88; letter-spacing: 3px; font-size: clamp(1.2rem, 4vw, 2rem);">> INCOMING TRANSMISSION...</h2>
            <button id="btn-accept-transmission" class="cyber-btn">ACCEPT</button>
        </div>

        <div id="coming-soon-content" style="display: none;">
            <img src="https://i.imgur.com/31WnC6D.png" alt="Evollogic" class="main-logo">
            <h1 class="title-text">BUILDER WORLDS</h1>
            <div class="message-card">
                <p style="font-size: 1.1rem; line-height: 1.6; color: #00ff88; margin-bottom: 20px;">
                    The portals are currently under maintenance. <br>
                    Exclusive access for the creation team only.
                </p>
                <p class="glitch-text">COMING THIS MONTH</p>
            </div>
            <button id="btn-toggle-music" class="cyber-btn-small">🔊 MUTE AUDIO</button>
        </div>

        <audio id="bg-music" loop style="display: none !important; width: 0; height: 0; visibility: hidden;">
            <source src="Menu Suspenso.mp3" type="audio/mpeg">
        </audio>
    </div>

    <div id="app-wrapper" style="display: none;">
        <div id="login-screen" class="login-box">
            <img src="https://i.imgur.com/31WnC6D.png" alt="Evollogic" style="width: 150px; margin-bottom: 10px;">
            <h2 style="color: #00ff88; margin-bottom: 20px; font-size: 1.5rem; letter-spacing: 2px;">ADMIN_PANEL</h2>
            
            <input type="email" id="email" placeholder="DECRYPT_EMAIL"><br>
            <input type="password" id="password" placeholder="SECURITY_KEY"><br>
            <button id="btn-login" class="cyber-btn" style="width: 100%;">ACCESS SYSTEM</button>
            
            <p id="error-message" style="color: #ff0055; display: none; margin-top: 15px; font-weight: bold; text-shadow: 0 0 5px #ff0055;">[!] ACCESS_DENIED</p>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
